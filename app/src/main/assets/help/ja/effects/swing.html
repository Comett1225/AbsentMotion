<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スイング | AbsentMotion</title><meta name="description" content="レイヤーを2つの角度の間で往復させます。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>スイング</h1><p class="meta"><a href="index.html#cat-move">移動</a> &middot; バージョン3.0.0で追加</p><img class="fx-thumb" src="../../../effects/thumb/swing.webp" width="192" height="192" alt="スイングエフェクトのプレビュー"><p>レイヤーを2つの角度の間で往復させます。</p><p>スイングはレイヤーを<strong>角度1</strong>と<strong>角度2</strong>の間で往復させます。<strong>頻度</strong>は1秒あたりの回数です。<strong>波形</strong>でサイン（なめらか）またはトライアングル（一定速度）を選び、<strong>位相</strong>でレイヤー同士をずらせます。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>周波数</strong></td><td data-label="種類">数値</td><td data-label="範囲">0.1 Hz〜16 Hz</td><td data-label="デフォルト">2 Hz</td></tr><tr><td data-label="設定項目"><strong>角度1</strong></td><td data-label="種類">角度</td><td data-label="範囲">-3600&deg;〜3600&deg;</td><td data-label="デフォルト">-30&deg;</td></tr><tr><td data-label="設定項目"><strong>角度2</strong></td><td data-label="種類">角度</td><td data-label="範囲">-3600&deg;〜3600&deg;</td><td data-label="デフォルト">30&deg;</td></tr><tr><td data-label="設定項目"><strong>位相</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜2</td><td data-label="デフォルト">0</td></tr><tr><td data-label="設定項目"><strong>波形</strong></td><td data-label="種類">選択</td><td data-label="範囲">サイン、三角</td><td data-label="デフォルト">サイン</td></tr></tbody></table></div><nav class="pager" aria-label="他の移動エフェクト"><a rel="prev" href="oscillate.html">&larr; オシレート</a><a rel="next" href="spin.html">スピン &rarr;</a></nav></main></div></body></html>
