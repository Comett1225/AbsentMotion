<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ズームブラー | AbsentMotion</title><meta name="description" content="中心点から放射状にサンプルを平均化し、強さを調整できる放射状のズームブラーをかけます。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>ズームブラー</h1><p class="meta"><a href="index.html#cat-blur">ブラー</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/radialblur.webp" width="192" height="192" alt="ズームブラーエフェクトのプレビュー"><p>中心点から放射状にサンプルを平均化し、強さを調整できる放射状のズームブラーをかけます。</p><p>ズームブラーは、カメラでズームしたときのように、1点から外側へ画像をにじませます。<strong>中央</strong>がその点、<strong>強さ</strong>が筋の長さです。すばやいズームトランジションには、<strong>強さ</strong>をアニメーションさせましょう。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>中心</strong></td><td data-label="種類">ポイント（X, Y）</td><td data-label="範囲">&ndash;</td><td data-label="デフォルト">0.5, 0.5</td></tr><tr><td data-label="設定項目"><strong>強さ</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1.9</td><td data-label="デフォルト">0.15</td></tr></tbody></table></div><nav class="pager" aria-label="他のブラーエフェクト"><a rel="prev" href="smear.html">&larr; スミア</a><a rel="next" href="chromaticzoomblur.html">色収差ズームブラー &rarr;</a></nav></main></div></body></html>
