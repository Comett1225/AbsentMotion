name: build

on:
  workflow_dispatch:
    inputs:
      subdir:
        description: Directory to build in, relative to the workspace
        default: '.'
      diagnostic:
        description: Only run the verify job, keep going after failures and repeat the compat unit tests
        type: boolean
        default: false
      verify_ref:
        description: Branch, tag or commit for the verify job to check out (empty means the workflow ref)
        default: ''
      repeat:
        description: Extra compat unit test runs in diagnostic mode
        default: '3'
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  foss-apk:
    if: ${{ !inputs.diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    container: debian:trixie
    defaults:
      run:
        working-directory: ${{ inputs.subdir || '.' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK: /opt/android-sdk/ndk/30.0.16248370
    steps:
      - name: Install packages
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl unzip xz-utils python3 build-essential clang lld ninja-build openjdk-21-jdk-headless
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          path: ${{ inputs.subdir || '.' }}
      - name: Install the Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip' | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"
      - name: Prepare the source as F-Droid does
        run: |
          rm -rf app/src/play third_party/whisper.cpp/models third_party/whisper.cpp/examples third_party/whisper.cpp/bindings third_party/ncnn/examples third_party/ncnn/benchmark third_party/ncnn/python third_party/ncnn/images
          sed -i -e '/playImplementation/d' app/build.gradle.kts
          echo 'org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64' >> gradle.properties
      - name: Build Skia
        run: tools/build_skia.sh
      - name: Build the foss APK
        run: ./gradlew :app:assembleFossRelease --no-daemon
      - name: Check unsigned APK packaging
        run: python3 tools/apk_check.py --unsigned app/build/outputs/apk/foss/release/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foss-apk
          path: ${{ inputs.subdir || '.' }}/app/build/outputs/apk/foss/release/*.apk
      - name: Check the lowest Android version the native libraries need
        run: python3 tools/api_floor.py app/build/outputs/apk/foss/release/*.apk

  compat-apk:
    if: ${{ !inputs.diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    container: debian:trixie
    defaults:
      run:
        working-directory: ${{ inputs.subdir || '.' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK: /opt/android-sdk/ndk/30.0.16248370
    steps:
      - name: Install packages
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl unzip xz-utils python3 build-essential clang lld ninja-build openjdk-21-jdk-headless
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          path: ${{ inputs.subdir || '.' }}
      - name: Install the Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip' | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"
      - name: Prepare the source as F-Droid does
        run: |
          rm -rf app/src/play third_party/whisper.cpp/models third_party/whisper.cpp/examples third_party/whisper.cpp/bindings third_party/ncnn/examples third_party/ncnn/benchmark third_party/ncnn/python third_party/ncnn/images
          sed -i -e '/playImplementation/d' app/build.gradle.kts
          echo 'org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64' >> gradle.properties
      - name: Build Skia for Android 9
        run: tools/build_skia.sh compat
      - name: Build the compat APK
        run: ./gradlew :app:assembleCompatRelease --no-daemon
      - name: Check unsigned APK packaging
        run: python3 tools/apk_check.py --unsigned app/build/outputs/apk/compat/release/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compat-apk
          path: ${{ inputs.subdir || '.' }}/app/build/outputs/apk/compat/release/*.apk
      - name: Check that the native libraries load on Android 9
        run: python3 tools/api_floor.py --min 28 app/build/outputs/apk/compat/release/*.apk

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK: /opt/android-sdk/ndk/30.0.16248370
    steps:
      - name: Install packages
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl unzip python3 python3-numpy python3-pil python3-fonttools nodejs clang openjdk-21-jdk-headless
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.verify_ref || '' }}
      - name: Show the checked out source
        run: git log -1 --format='%H %s'
      - name: Install the Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip' | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"
      - name: Quick checks (static checks, foss compile, unit tests)
        id: quick
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo 'org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64' >> gradle.properties
          sh tools/check.sh --quick
      - name: Write the unit test report reader
        if: ${{ !cancelled() }}
        working-directory: /
        run: |
          cat > /tmp/test_failures.py <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(sys.argv[1])
          cases = []
          failed = []
          skipped = []
          for f in sorted(root.rglob("*.xml")):
              try:
                  tree = ET.parse(f)
              except ET.ParseError:
                  continue
              for case in tree.iter("testcase"):
                  name = case.get("classname", "") + "." + case.get("name", "")
                  cases.append((float(case.get("time", "0") or 0), name, f))
                  for kind in ("failure", "error"):
                      for node in case.findall(kind):
                          failed.append((name, kind, node.get("message", ""), node.text or "", f))
                  if case.find("skipped") is not None:
                      skipped.append(name)
          print(f"{root}: {len(cases)} test cases, {len(failed)} failed, {len(skipped)} skipped")
          for name in skipped:
              print(f"SKIPPED {name}")
          for name, kind, message, text, f in failed:
              print(f"::error title=Unit test {kind}::{name}: {message[:300]}")
              print(f"FAILED {name} ({kind}) in {f}")
              print("\n".join(text.splitlines()[:80]))
          for t, name, f in sorted(cases, reverse=True)[:15]:
              print(f"SLOW {t:.3f}s {name}")
          sys.exit(1 if failed else 0)
          PY
      - name: Compat unit tests and lint of both builds
        id: compat
        if: ${{ !cancelled() && (inputs.diagnostic || steps.quick.outcome == 'success') }}
        run: ./gradlew :app:testCompatDebugUnitTest :app:lintFossDebug :app:lintCompatDebug -q --continue
      - name: Failed unit tests
        if: ${{ !cancelled() }}
        run: python3 /tmp/test_failures.py app/build/test-results
      - name: Repeat the compat unit tests
        if: ${{ !cancelled() && inputs.diagnostic }}
        env:
          REPEAT: ${{ inputs.repeat || '0' }}
        run: |
          mkdir -p build/test-repeats
          cp -r app/build/test-results/testCompatDebugUnitTest build/test-repeats/run-0 2>/dev/null || true
          status=0
          i=1
          while [ "$i" -le "$REPEAT" ]; do
            ./gradlew :app:testCompatDebugUnitTest --rerun -q || status=1
            cp -r app/build/test-results/testCompatDebugUnitTest "build/test-repeats/run-$i"
            python3 /tmp/test_failures.py "build/test-repeats/run-$i" || true
            i=$((i + 1))
          done
          python3 /tmp/test_failures.py build/test-repeats
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: test-results
          if-no-files-found: ignore
          path: |
            app/build/test-results
            app/build/reports/tests
            app/build/reports/lint-results-*.xml
            build/test-repeats
