name: build

on:
  workflow_dispatch:
    inputs:
      subdir:
        description: Directory to build in, relative to the workspace
        default: '.'
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  foss-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    container: debian:trixie
    defaults:
      run:
        working-directory: ${{ inputs.subdir || '.' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK: /opt/android-sdk/ndk/30.0.16248370
    steps:
      - name: Install packages
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl unzip xz-utils python3 build-essential clang lld ninja-build openjdk-21-jdk-headless
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          path: ${{ inputs.subdir || '.' }}
      - name: Install the Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip' | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"
      - name: Prepare the source as F-Droid does
        run: |
          rm -rf app/src/play third_party/whisper.cpp/models third_party/whisper.cpp/examples third_party/whisper.cpp/bindings third_party/ncnn/examples third_party/ncnn/benchmark third_party/ncnn/python third_party/ncnn/images
          sed -i -e '/playImplementation/d' app/build.gradle.kts
          echo 'org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64' >> gradle.properties
      - name: Build Skia
        run: tools/build_skia.sh
      - name: Build the foss APK
        run: ./gradlew :app:assembleFossRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foss-apk
          path: ${{ inputs.subdir || '.' }}/app/build/outputs/apk/foss/release/*.apk

  compat-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    container: debian:trixie
    defaults:
      run:
        working-directory: ${{ inputs.subdir || '.' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK: /opt/android-sdk/ndk/30.0.16248370
    steps:
      - name: Install packages
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl unzip xz-utils python3 build-essential clang lld ninja-build openjdk-21-jdk-headless
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          path: ${{ inputs.subdir || '.' }}
      - name: Install the Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip' | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"
      - name: Prepare the source as F-Droid does
        run: |
          rm -rf app/src/play third_party/whisper.cpp/models third_party/whisper.cpp/examples third_party/whisper.cpp/bindings third_party/ncnn/examples third_party/ncnn/benchmark third_party/ncnn/python third_party/ncnn/images
          sed -i -e '/playImplementation/d' app/build.gradle.kts
          echo 'org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64' >> gradle.properties
      - name: Build Skia for Android 9
        run: tools/build_skia.sh compat
      - name: Build the compat APK
        run: ./gradlew :app:assembleCompatRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compat-apk
          path: ${{ inputs.subdir || '.' }}/app/build/outputs/apk/compat/release/*.apk

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK: /opt/android-sdk/ndk/30.0.16248370
    steps:
      - name: Install packages
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl unzip python3 python3-numpy python3-pil python3-fonttools nodejs clang openjdk-21-jdk-headless
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip' | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"
      - name: Quick checks (static checks, foss compile, unit tests)
        run: |
          echo 'org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64' >> gradle.properties
          sh tools/check.sh --quick
