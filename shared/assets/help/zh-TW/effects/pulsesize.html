<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脈衝大小 | AbsentMotion</title><meta name="description" content="依正弦波或三角波反覆放大及縮小圖層。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>脈衝大小</h1><p class="meta"><a href="index.html#cat-move">移動</a> &middot; 新增於版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/pulsesize.webp" width="192" height="192" alt="脈衝大小 特效的預覽"><p>依正弦波或三角波反覆放大及縮小圖層。</p><p>脈動大小會讓圖層反覆放大與縮小。<strong>縮小</strong>與<strong>放大</strong>是相對於正常大小的最小與最大倍率（0.9 代表 90%），<strong>頻率</strong>是每秒的脈動次數，<strong>波形</strong>則是正弦（平滑）或三角。心跳或與節拍同步的標誌是常見的用法。另見<a href="../effects/pulseopacity.html">脈動不透明度</a>。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>頻率</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 Hz 至 16 Hz</td><td data-label="預設值">2 Hz</td></tr><tr><td data-label="設定項目"><strong>縮小</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.9</td></tr><tr><td data-label="設定項目"><strong>放大</strong></td><td data-label="類型">數字</td><td data-label="範圍">1 至 2</td><td data-label="預設值">1.1</td></tr><tr><td data-label="設定項目"><strong>起始相位</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 2</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>波形</strong></td><td data-label="類型">選項</td><td data-label="範圍">正弦、三角</td><td data-label="預設值">正弦</td></tr></tbody></table></div><nav class="pager" aria-label="更多 移動 特效"><a rel="prev" href="spin.html">&larr; 旋轉</a><a rel="next" href="pulseopacity.html">脈衝不透明度 &rarr;</a></nav></main></div></body></html>
