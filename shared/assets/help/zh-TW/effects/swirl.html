<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漩渦 | AbsentMotion</title><meta name="description" content="像漩渦一樣繞著中心扭轉圖層，中央最強，到半徑處（圖層大小的比例）逐漸消失。強度為負值時反向扭轉。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>漩渦</h1><p class="meta"><a href="index.html#cat-distort">扭曲</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/twirl.webp" width="192" height="192" alt="漩渦 特效的預覽"><p>像漩渦一樣繞著中心扭轉圖層，中央最強，到半徑處（圖層大小的比例）逐漸消失。強度為負值時反向扭轉。</p><p>漩渦會讓圖層以某個點為中心扭曲，就像漩渦一樣。<strong>中心</strong>是扭曲的中心，<strong>強度</strong>是扭曲的程度（負值會反向扭曲），<strong>半徑</strong>則是離中心多遠會受到影響。將強度從 0 開始做動畫，即可做出螺旋轉場。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>中心</strong></td><td data-label="類型">點（X, Y）</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.5, 0.5</td></tr><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">-0.5 至 0.5</td><td data-label="預設值">0.1</td></tr><tr><td data-label="設定項目"><strong>半徑</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 3</td><td data-label="預設值">0.3</td></tr></tbody></table></div><nav class="pager" aria-label="更多 扭曲 特效"><span></span><a rel="next" href="pinchbulge.html">收縮／膨脹 &rarr;</a></nav></main></div></body></html>
