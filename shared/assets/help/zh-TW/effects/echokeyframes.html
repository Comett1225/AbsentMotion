<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>關鍵影格迴聲 | AbsentMotion</title><meta name="description" content="依圖層的動畫繪製其稍早狀態的複本。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>關鍵影格迴聲</h1><p class="meta"><a href="index.html#cat-move">移動</a> &middot; 新增於版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/echo.webp" width="192" height="192" alt="關鍵影格迴聲 特效的預覽"><p>依圖層的動畫繪製其稍早狀態的複本。</p><p>回音關鍵影格會繪製圖層稍早前的副本，因此移動中的圖層會留下殘影。<strong>秒</strong>是副本往回追溯的秒數，<strong>數量</strong>是副本的數目，<strong>Alpha</strong>是副本的可見程度，<strong>合成</strong>則決定副本位於圖層<strong>後方</strong>還是<strong>上方</strong>。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>秒</strong></td><td data-label="類型">數字</td><td data-label="範圍">-60 至 60</td><td data-label="預設值">0.5</td></tr><tr><td data-label="設定項目"><strong>數量</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 20</td><td data-label="預設值">1</td></tr><tr><td data-label="設定項目"><strong>Alpha</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">1</td></tr><tr><td data-label="設定項目"><strong>合成</strong></td><td data-label="類型">選項</td><td data-label="範圍">後方、上方</td><td data-label="預設值">後方</td></tr></tbody></table></div><nav class="pager" aria-label="更多 移動 特效"><a rel="prev" href="parentinghelper.html">&larr; 父子關係輔助</a><a rel="next" href="framerate.html">影格速率 &rarr;</a></nav></main></div></body></html>
