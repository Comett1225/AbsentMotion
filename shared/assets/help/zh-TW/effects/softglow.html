<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柔光暈 | AbsentMotion</title><meta name="description" content="以濾色模式疊加柔和模糊的圖片複本，讓亮部產生夢幻光暈。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>柔光暈</h1><p class="meta"><a href="index.html#cat-stylize">風格化</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/softglow.webp" width="192" height="192" alt="柔光暈 特效的預覽"><p>以濾色模式疊加柔和模糊的圖片複本，讓亮部產生夢幻光暈。</p><p>柔光會在畫面上方疊加一份模糊的副本，營造夢幻、朦朧的效果，主要作用於亮部。<strong>大小</strong>是朦朧的柔和程度，<strong>亮部</strong>是有多少來自畫面中的亮部，<strong>顏色</strong>會為它上色。<strong>不透明度</strong>會將它與原始畫面混合。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>大小</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 300</td><td data-label="預設值">20</td></tr><tr><td data-label="設定項目"><strong>亮度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 3</td><td data-label="預設值">1</td></tr><tr><td data-label="設定項目"><strong>對比</strong></td><td data-label="類型">數字</td><td data-label="範圍">-1 至 1</td><td data-label="預設值">0.2</td></tr><tr><td data-label="設定項目"><strong>亮部</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.5</td></tr><tr><td data-label="設定項目"><strong>顏色</strong></td><td data-label="類型">顏色</td><td data-label="範圍">&ndash;</td><td data-label="預設值"><span><span class="sw" style="background:#ff5566"></span>#FF5566</span></td></tr><tr><td data-label="設定項目"><strong>混合</strong></td><td data-label="類型">數字</td><td data-label="範圍">0% 至 100%</td><td data-label="預設值">25%</td></tr><tr><td data-label="設定項目"><strong>不透明度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">1</td></tr><tr><td data-label="設定項目"><strong>外側光暈</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多 風格化 特效"><a rel="prev" href="lightglow.html">&larr; 亮部發光</a><a rel="next" href="deepglow.html">深度光暈 &rarr;</a></nav></main></div></body></html>
