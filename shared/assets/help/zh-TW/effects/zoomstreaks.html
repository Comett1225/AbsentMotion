<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>縮放光束 | AbsentMotion</title><meta name="description" content="將圖層的複本繞著某個點縮放並保留最亮的像素，做出從該點射出的光束。平均則會變成縮放模糊。R、G、B、A 可逐一選擇複本要保留最低值、最高值或平均值，或不處理該色版。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>縮放光束</h1><p class="meta"><a href="index.html#cat-blur">模糊</a> &middot; 新增於版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/zoomstreaks.webp" width="192" height="192" alt="縮放光束 特效的預覽"><p>將圖層的複本繞著某個點縮放並保留最亮的像素，做出從該點射出的光束。平均則會變成縮放模糊。R、G、B、A 可逐一選擇複本要保留最低值、最高值或平均值，或不處理該色版。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>中心</strong></td><td data-label="類型">點（X, Y）</td><td data-label="範圍">-1 至 2</td><td data-label="預設值">0.5, 0.5</td></tr><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.15</td></tr><tr><td data-label="設定項目"><strong>Alpha</strong></td><td data-label="類型">數字</td><td data-label="範圍">0% 至 100%</td><td data-label="預設值">100%</td></tr><tr><td data-label="設定項目"><strong>偏移量</strong></td><td data-label="類型">數字</td><td data-label="範圍">-100% 至 100%</td><td data-label="預設值">0%</td></tr><tr><td data-label="設定項目"><strong>R</strong></td><td data-label="類型">選項</td><td data-label="範圍">最小、最大、平均、關閉</td><td data-label="預設值">最大</td></tr><tr><td data-label="設定項目"><strong>G</strong></td><td data-label="類型">選項</td><td data-label="範圍">最小、最大、平均、關閉</td><td data-label="預設值">最大</td></tr><tr><td data-label="設定項目"><strong>B</strong></td><td data-label="類型">選項</td><td data-label="範圍">最小、最大、平均、關閉</td><td data-label="預設值">最大</td></tr><tr><td data-label="設定項目"><strong>A</strong></td><td data-label="類型">選項</td><td data-label="範圍">最小、最大、平均、關閉</td><td data-label="預設值">最大</td></tr></tbody></table></div><nav class="pager" aria-label="更多 模糊 特效"><a rel="prev" href="chromaticzoomblur.html">&larr; 色差縮放模糊</a><a rel="next" href="spinstreaks.html">旋轉光痕 &rarr;</a></nav></main></div></body></html>
