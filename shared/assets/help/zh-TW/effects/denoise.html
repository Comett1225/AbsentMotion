<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>降噪 | AbsentMotion</title><meta name="description" content="使用保留邊緣的雙邊濾鏡移除圖片雜訊，只對顏色相近的鄰近像素取平均值。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>降噪</h1><p class="meta"><a href="index.html#cat-blur">模糊</a> &middot; 新增於版本 2.5.0</p><img class="fx-thumb" src="../../../effects/thumb/denoise.webp" width="192" height="192" alt="降噪 特效的預覽"><p>使用保留邊緣的雙邊濾鏡移除圖片雜訊，只對顏色相近的鄰近像素取平均值。</p><p>降噪會移除顆粒與雜訊，同時盡量保留邊緣的清晰度。<strong>強度</strong>是移除多少雜訊，<strong>半徑</strong>是每個像素周圍參考的範圍，<strong>細節</strong>則是保留多少精細的細節。過度降噪會讓皮膚與表面看起來平板。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.5</td></tr><tr><td data-label="設定項目"><strong>半徑</strong></td><td data-label="類型">數字</td><td data-label="範圍">1 至 6</td><td data-label="預設值">2</td></tr><tr><td data-label="設定項目"><strong>細節</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.5</td></tr></tbody></table></div><nav class="pager" aria-label="更多 模糊 特效"><a rel="prev" href="fillbehind.html">&larr; 填滿後方</a><span></span></nav></main></div></body></html>
