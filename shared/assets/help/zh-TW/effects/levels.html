<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色階 | AbsentMotion</title><meta name="description" content="透過輸入黑白點、伽瑪值及輸出黑白點調整圖片色階。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>色階</h1><p class="meta"><a href="index.html#cat-color">顏色</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/levels.webp" width="192" height="192" alt="色階 特效的預覽"><p>透過輸入黑白點、伽瑪值及輸出黑白點調整圖片色階。</p><p>色階會設定哪個亮度會變成純黑、哪個會變成純白。提高<strong>輸入黑點</strong>會讓陰影更暗，降低<strong>輸入白點</strong>會讓高光更亮。<strong>伽瑪</strong>會改變中間調，但不影響純黑與純白。<strong>輸出黑點</strong>與<strong>輸出白點</strong>會限制最終的範圍，可做出褪色的效果。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>輸入黑點</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.1</td></tr><tr><td data-label="設定項目"><strong>輸入白點</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.85</td></tr><tr><td data-label="設定項目"><strong>伽瑪</strong></td><td data-label="類型">數字</td><td data-label="範圍">0.2 至 5</td><td data-label="預設值">1</td></tr><tr><td data-label="設定項目"><strong>輸出黑點</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>輸出白點</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多 顏色 特效"><a rel="prev" href="invert.html">&larr; 反相</a><a rel="next" href="posterize.html">色調分離 &rarr;</a></nav></main></div></body></html>
