<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>羽化 | AbsentMotion</title><meta name="description" content="柔化圖層的Alpha邊緣。「向內」在現有輪廓內淡化；「模糊Alpha」也會將柔化邊緣擴散至輪廓外。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>羽化</h1><p class="meta"><a href="index.html#cat-key">去背</a> &middot; 新增於版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/feather.webp" width="192" height="192" alt="羽化 特效的預覽"><p>柔化圖層的Alpha邊緣。「向內」在現有輪廓內淡化；「模糊Alpha」也會將柔化邊緣擴散至輪廓外。</p><p>羽化會柔化圖層的邊緣。<strong>強度</strong>是柔和邊緣的寬度。<strong>邊緣</strong>可設為<strong>向內</strong>（邊緣向圖層內部淡出）或<strong>模糊Alpha</strong>（柔和邊緣也會延伸到原始輪廓之外）。在<a href="../effects/chromakey.html">色度鍵</a>之後使用，可獲得更乾淨的去背效果。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 300</td><td data-label="預設值">20</td></tr><tr><td data-label="設定項目"><strong>邊緣</strong></td><td data-label="類型">選項</td><td data-label="範圍">向內、模糊Alpha</td><td data-label="預設值">模糊Alpha</td></tr></tbody></table></div><nav class="pager" aria-label="更多 去背 特效"><a rel="prev" href="wipe.html">&larr; 擦除</a><a rel="next" href="radialwipe.html">放射狀擦除 &rarr;</a></nav></main></div></body></html>
