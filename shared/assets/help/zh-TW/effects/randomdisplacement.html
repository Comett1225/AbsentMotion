<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隨機位移 | AbsentMotion</title><meta name="description" content="讓圖層隨時間平順地隨機移動。種子可選擇不同的移動方式，速度控制移動快慢，演變則會改變移動模式。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>隨機位移</h1><p class="meta"><a href="index.html#cat-move">移動</a> &middot; 新增於版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/randomdisplace.webp" width="192" height="192" alt="隨機位移 特效的預覽"><p>讓圖層隨時間平順地隨機移動。種子可選擇不同的移動方式，速度控制移動快慢，演變則會改變移動模式。</p><p>隨機位移會讓圖層平滑而隨機地移動，就像漂移的相機一樣。<strong>幅度</strong>是它漂移的距離，<strong>速度</strong>是移動的快慢，<strong>種子</strong>會選擇不同的路徑。與<a href="../effects/autoshake.html">自動抖動</a>不同，這種移動緩慢而流暢，而不是跳動的。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>幅度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 2000</td><td data-label="預設值">50</td></tr><tr><td data-label="設定項目"><strong>演變</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 2000</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>種子</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 5</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>散布</strong></td><td data-label="類型">數字</td><td data-label="範圍">0% 至 200%</td><td data-label="預設值">50%</td></tr><tr><td data-label="設定項目"><strong>速度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 50</td><td data-label="預設值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多 移動 特效"><a rel="prev" href="autoshake.html">&larr; 自動抖動</a><a rel="next" href="randomjitter.html">隨機抖動 &rarr;</a></nav></main></div></body></html>
