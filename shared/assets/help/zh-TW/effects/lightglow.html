<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亮部發光 | AbsentMotion</title><meta name="description" content="在圖片中亮度超過臨界值的部分周圍加入彩色光暈。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>亮部發光</h1><p class="meta"><a href="index.html#cat-stylize">風格化</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/lightglow.webp" width="192" height="192" alt="亮部發光 特效的預覽"><p>在圖片中亮度超過臨界值的部分周圍加入彩色光暈。</p><p>光線發光只會在畫面比<strong>臨界值</strong>更亮的地方發光。降低閾值會讓畫面中更多區域發光，提高<strong>強度</strong>會讓光更強，改變<strong>大小</strong>則可調整它擴散的範圍。<strong>顏色</strong>會為光染色。</p>
<p>適用於夜景、燈光、霓虹與明亮的高光。若要在形狀周圍加上光暈，請使用<a href="../effects/glow.html">發光</a>。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>大小</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 300</td><td data-label="預設值">90</td></tr><tr><td data-label="設定項目"><strong>臨界值</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.6</td></tr><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 10</td><td data-label="預設值">1</td></tr><tr><td data-label="設定項目"><strong>顏色</strong></td><td data-label="類型">顏色</td><td data-label="範圍">&ndash;</td><td data-label="預設值"><span><span class="sw" style="background:#ffe0a0"></span>#FFE0A0</span></td></tr><tr><td data-label="設定項目"><strong>混合</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">1</td></tr><tr><td data-label="設定項目"><strong>不透明度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多 風格化 特效"><a rel="prev" href="glow.html">&larr; 發光</a><a rel="next" href="softglow.html">柔光暈 &rarr;</a></nav></main></div></body></html>
