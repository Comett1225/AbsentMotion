<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影格速率 | AbsentMotion</title><meta name="description" content="讓此圖層以較低的影格速率移動，呈現卡頓或定格動畫的效果。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>影格速率</h1><p class="meta"><a href="index.html#cat-move">移動</a> &middot; 新增於版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/timequant.webp" width="192" height="192" alt="影格速率 特效的預覽"><p>讓此圖層以較低的影格速率移動，呈現卡頓或定格動畫的效果。</p><p>影格速率會讓圖層以較低的影格速率移動，產生不流暢的定格動畫效果。它適用於影片、形狀、文字與群組。設定圖層每秒顯示的影格數：數字越低，動作就越不流暢。</p>
