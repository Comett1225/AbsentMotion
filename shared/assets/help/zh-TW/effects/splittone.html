<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分離色調 | AbsentMotion</title><meta name="description" content="分別為陰影和亮部染上不同色相，同時保留黑白與亮度。陰影階調會彎曲亮度曲線，亮部階調會調整亮部顏色的起始位置。漸層對應樣式僅依像素亮度指定顏色。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>分離色調</h1><p class="meta"><a href="index.html#cat-color">顏色</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/splittone.webp" width="192" height="192" alt="分離色調 特效的預覽"><p>分別為陰影和亮部染上不同色相，同時保留黑白與亮度。陰影階調會彎曲亮度曲線，亮部階調會調整亮部顏色的起始位置。漸層對應樣式僅依像素亮度指定顏色。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>陰影色相</strong></td><td data-label="類型">角度</td><td data-label="範圍">-360&deg; 至 360&deg;</td><td data-label="預設值">200&deg;</td></tr><tr><td data-label="設定項目"><strong>陰影強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.6</td></tr><tr><td data-label="設定項目"><strong>亮部色相</strong></td><td data-label="類型">角度</td><td data-label="範圍">-360&deg; 至 360&deg;</td><td data-label="預設值">35&deg;</td></tr><tr><td data-label="設定項目"><strong>亮部強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.6</td></tr><tr><td data-label="設定項目"><strong>陰影階調</strong></td><td data-label="類型">數字</td><td data-label="範圍">-0.9 至 1</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>亮部階調</strong></td><td data-label="類型">數字</td><td data-label="範圍">-1 至 0.9</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>樣式</strong></td><td data-label="類型">選項</td><td data-label="範圍">色
