<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>擦除 | AbsentMotion</title><meta name="description" content="從相對的兩側隱藏圖層。為起點或終點製作動畫，即可做出擦除轉場。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>擦除</h1><p class="meta"><a href="index.html#cat-key">去背</a> &middot; 新增於版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/wipe.webp" width="192" height="192" alt="擦除 特效的預覽"><p>從相對的兩側隱藏圖層。為起點或終點製作動畫，即可做出擦除轉場。</p><p>擦除會從相反的兩側隱藏圖層。為<strong>起點</strong>或<strong>終點</strong>加上動畫，即可用直線邊緣顯示或移除圖層；<strong>角度</strong>是邊緣的方向，<strong>羽化</strong>則會柔化它。若想要像時鐘指針一樣的擦除，請使用<a href="../effects/radialwipe.html">徑向擦除</a>。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>起點</strong></td><td data-label="類型">數字</td><td data-label="範圍">-50% 至 150%</td><td data-label="預設值">0%</td></tr><tr><td data-label="設定項目"><strong>終點</strong></td><td data-label="類型">數字</td><td data-label="範圍">-50% 至 150%</td><td data-label="預設值">100%</td></tr><tr><td data-label="設定項目"><strong>角度</strong></td><td data-label="類型">角度</td><td data-label="範圍">-3600&deg; 至 3600&deg;</td><td data-label="預設值">0&deg;</td></tr><tr><td data-label="設定項目"><strong>羽化</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 100</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>柔和度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 % 至 100 %</td><td data-label="預設值">0 %</td></tr></tbody></table></div><nav class="pager" aria-label="更多 去背 特效"><a rel="prev" href="crop.html">&larr; 裁切</a><a rel="next" href="feather.html">羽化 &rarr;</a></nav></main></div></body></html>
