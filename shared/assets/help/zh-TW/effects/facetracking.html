<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>臉部追蹤 | AbsentMotion</title><meta name="description" content="影片圖層的臉部動態：影片會移動並縮放，讓你選擇的臉部始終停在畫面中的同一位置。點一下「選擇臉部」，再點一下預覽中的一張臉。臉部只會在整個片段中追蹤一次並保存結果，預覽和匯出都能立即使用。「縮放」設定臉部保持的大小（100%為選擇時的大小），「位置」設定它在畫面中停留的位置，「平滑度」讓動作更平穩。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>臉部追蹤</h1><p class="meta"><a href="index.html#cat-move">移動</a> &middot; 新增於版本 5.3.2</p><img class="fx-thumb" src="../../../effects/thumb/facetrack.webp" width="192" height="192" alt="臉部追蹤 特效的預覽"><p>影片圖層的臉部動態：影片會移動並縮放，讓你選擇的臉部始終停在畫面中的同一位置。點一下「選擇臉部」，再點一下預覽中的一張臉。臉部只會在整個片段中追蹤一次並保存結果，預覽和匯出都能立即使用。「縮放」設定臉部保持的大小（100%為選擇時的大小），「位置」設定它在畫面中停留的位置，「平滑度」讓動作更平穩。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>縮放</strong></td><td data-label="類型">數字</td><td data-label="範圍">10% 至 1000%</td><td data-label="預設值">100%</td></tr><tr><td data-label="設定項目"><strong>位置</strong></td><td data-label="類型">點（X, Y）</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.5, 0.5</td></tr><tr><td data-label="設定項目"><strong>平滑度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0% 至 100%</td><td data-label="預設值">30%</td></tr></tbody></table></div><nav class="pager" aria-label="更多 移動 特效"><a rel="prev" href="parentinghelper.html">&larr; 父子關係輔助</a><a rel="next" href="echokeyframes.html">關鍵影格迴聲 &rarr;</a></nav></main></div></body></html>
