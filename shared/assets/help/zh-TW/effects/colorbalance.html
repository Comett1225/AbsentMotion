<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顏色平衡 | AbsentMotion</title><meta name="description" content="分別調整暗部、中間調和亮部的顏色（灰色不會改變該範圍）。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>顏色平衡</h1><p class="meta"><a href="index.html#cat-color">顏色</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/colorbalance.webp" width="192" height="192" alt="顏色平衡 特效的預覽"><p>分別調整暗部、中間調和亮部的顏色（灰色不會改變該範圍）。</p><p>三個色彩色票，分別是<strong>暗部</strong>、<strong>中間調</strong>與<strong>亮部</strong>，會將畫面的暗部、中間部分與亮部推向各自的顏色。灰色色票會讓該範圍維持不變。<strong>數量</strong>會將結果與原始畫面混合。預設風格是青橘色調：冷色的陰影與暖色的高光。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>暗部</strong></td><td data-label="類型">顏色</td><td data-label="範圍">&ndash;</td><td data-label="預設值"><span><span class="sw" style="background:#3060a0"></span>#3060A0</span></td></tr><tr><td data-label="設定項目"><strong>中間調</strong></td><td data-label="類型">顏色</td><td data-label="範圍">&ndash;</td><td data-label="預設值"><span><span class="sw" style="background:#808080"></span>#808080</span></td></tr><tr><td data-label="設定項目"><strong>亮部</strong></td><td data-label="類型">顏色</td><td data-label="範圍">&ndash;</td><td data-label="預設值"><span><span class="sw" style="background:#ffb070"></span>#FFB070</span></td></tr><tr><td data-label="設定項目"><strong>數量</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.5</td></tr></tbody></table></div><nav class="pager" aria-label="更多 顏色 特效"><a rel="prev" href="fourcolorgradient.html">&larr; 四色漸層</a><a rel="next" href="liftgammagain.html">暗部、中間調、亮部 &rarr;</a></nav></main></div></body></html>
