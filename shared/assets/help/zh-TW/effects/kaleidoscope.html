<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>萬花筒 | AbsentMotion</title><meta name="description" content="將鏡像切片繞著中心點排列。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>萬花筒</h1><p class="meta"><a href="index.html#cat-repeat">重複</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/kaleidoscope.webp" width="192" height="192" alt="萬花筒 特效的預覽"><p>將鏡像切片繞著中心點排列。</p><p>萬花筒會以某個點為中心，在圓形中重複畫面的一個切片。<strong>分段數</strong>是切片的數量，<strong>角度</strong>會旋轉圖案，<strong>中心</strong>則是中心點。將角度做成動畫，即可得到旋轉的圖案。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>中心</strong></td><td data-label="類型">點（X, Y）</td><td data-label="範圍">-1 至 2</td><td data-label="預設值">0.5, 0.5</td></tr><tr><td data-label="設定項目"><strong>分段數</strong></td><td data-label="類型">數字</td><td data-label="範圍">1 至 64</td><td data-label="預設值">6</td></tr><tr><td data-label="設定項目"><strong>角度</strong></td><td data-label="類型">角度</td><td data-label="範圍">-360&deg; 至 360&deg;</td><td data-label="預設值">0&deg;</td></tr><tr><td data-label="設定項目"><strong>鏡像</strong></td><td data-label="類型">開或關</td><td data-label="範圍">&ndash;</td><td data-label="預設值">開</td></tr></tbody></table></div><nav class="pager" aria-label="更多 重複 特效"><span></span><a rel="next" href="mirror.html">鏡像 &rarr;</a></nav></main></div></body></html>
