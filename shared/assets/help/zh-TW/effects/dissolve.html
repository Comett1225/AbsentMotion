<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>溶解 | AbsentMotion</title><meta name="description" content="隨機移除圖層中的像素或方塊。為強度加入動畫可製作溶解轉場；種子決定圖樣，大小決定每個斑點的尺寸。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>溶解</h1><p class="meta"><a href="index.html#cat-noise">雜訊</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/dissolve.webp" width="192" height="192" alt="溶解 特效的預覽"><p>隨機移除圖層中的像素或方塊。為強度加入動畫可製作溶解轉場；種子決定圖樣，大小決定每個斑點的尺寸。</p><p>溶解會隨機移除圖層上的細點。將<strong>強度</strong>從 0 動畫到 1，即可做出溶解轉場。<strong>大小</strong>是每個細點的大小，<strong>種子</strong>則選擇圖案。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.75</td></tr><tr><td data-label="設定項目"><strong>種子</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 5</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>大小</strong></td><td data-label="類型">數字</td><td data-label="範圍">1 至 200</td><td data-label="預設值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多 雜訊 特效"><a rel="prev" href="fractalridges.html">&larr; 碎形山脊</a><a rel="next" href="blockdissolve.html">方塊消散 &rarr;</a></nav></main></div></body></html>
