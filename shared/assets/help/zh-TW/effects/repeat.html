<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重複器 | AbsentMotion</title><meta name="description" content="動態產生多個圖層複本。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>重複器</h1><p class="meta"><a href="index.html#cat-repeat">重複</a> &middot; 新增於版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/repeat.webp" width="192" height="192" alt="重複器 特效的預覽"><p>動態產生多個圖層複本。</p><p>重複會依序製作圖層的副本。<strong>數量</strong>是副本的數目，<strong>位移</strong>是每個副本相對於前一個副本移動的距離，<strong>角度</strong>與<strong>縮放</strong>決定每個副本如何旋轉與變大，而<strong>時間</strong>會延遲每個副本，讓它們像尾跡一樣跟著圖層。其他排列方式請見<a href="../effects/linearrepeat.html">線性重複</a>、<a href="../effects/radialrepeat.html">放射狀重複</a>與<a href="../effects/gridrepeat.html">網格重複</a>。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>數量</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 9999</td><td data-label="預設值">10</td></tr><tr><td data-label="設定項目"><strong>時間</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 9999</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>位移</strong></td><td data-label="類型">點（X, Y）</td><td data-label="範圍">-99999 至 99999</td><td data-label="預設值">0, 0</td></tr><tr><td data-label="設定項目"><strong>角度</strong></td><td data-label="類型">角度</td><td data-label="範圍">-3600&deg; 至 3600&deg;</td><td data-label="預設值">0&deg;</td></tr><tr><td data-label="設定項目"><strong>縮放</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 10</td><td data-label="預設值">1</td></tr><tr><td data-label="設定項目"><strong>透明度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0% 至 100%</td><td data-label="預設值">100%</td></tr></tbody></table></div><nav class="pager" aria-label="更多 重複 特效"><a rel="prev" href="tile.html">&larr; 拼貼</a><a rel="next" href="videofeedback.html">影像回授 &rarr;</a></nav></main></div></body></html>
