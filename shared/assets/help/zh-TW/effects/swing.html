<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>擺動 | AbsentMotion</title><meta name="description" content="讓圖層在兩個角度之間來回旋轉。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>擺動</h1><p class="meta"><a href="index.html#cat-move">移動</a> &middot; 新增於版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/swing.webp" width="192" height="192" alt="擺動 特效的預覽"><p>讓圖層在兩個角度之間來回旋轉。</p><p>擺盪會讓圖層在 <strong>角度1</strong> 與 <strong>角度2</strong> 之間來回擺動，每秒 <strong>頻率</strong> 次。使用<strong>波形</strong>選擇正弦（平滑）或三角（速度穩定），並使用<strong>相位</strong>讓各圖層彼此錯開。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>頻率</strong></td><td data-label="類型">數字</td><td data-label="範圍">0.1 Hz 至 16 Hz</td><td data-label="預設值">2 Hz</td></tr><tr><td data-label="設定項目"><strong>角度1</strong></td><td data-label="類型">角度</td><td data-label="範圍">-3600&deg; 至 3600&deg;</td><td data-label="預設值">-30&deg;</td></tr><tr><td data-label="設定項目"><strong>角度2</strong></td><td data-label="類型">角度</td><td data-label="範圍">-3600&deg; 至 3600&deg;</td><td data-label="預設值">30&deg;</td></tr><tr><td data-label="設定項目"><strong>相位</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 2</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>波形</strong></td><td data-label="類型">選項</td><td data-label="範圍">正弦波、三角波</td><td data-label="預設值">正弦波</td></tr></tbody></table></div><nav class="pager" aria-label="更多 移動 特效"><a rel="prev" href="oscillate.html">&larr; 擺動</a><a rel="next" href="spin.html">旋轉 &rarr;</a></nav></main></div></body></html>
