<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色溫 | AbsentMotion</title><meta name="description" content="以開爾文色溫調整圖片冷暖；6500 K不會改變圖片。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>色溫</h1><p class="meta"><a href="index.html#cat-color">顏色</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/temperature.webp" width="192" height="192" alt="色溫 特效的預覽"><p>以開爾文色溫調整圖片冷暖；6500 K不會改變圖片。</p><p>讓畫面變得更暖或更冷，彷彿它是被某個色溫（以克耳文為單位）的燈照亮一樣。<strong>色溫</strong>設為 6500 K 時畫面不變；數值較低會呈現較暖的橘色調，數值較高則呈現較冷的藍色調。<strong>強度</strong>會將結果與原始畫面混合。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>色溫</strong></td><td data-label="類型">數字</td><td data-label="範圍">1000 至 40000</td><td data-label="預設值">3200</td></tr><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多 顏色 特效"><a rel="prev" href="splittone.html">&larr; 分離色調</a><a rel="next" href="duotone.html">雙色調 &rarr;</a></nav></main></div></body></html>
