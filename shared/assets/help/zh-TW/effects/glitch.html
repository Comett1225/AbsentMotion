<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>故障 | AbsentMotion</title><meta name="description" content="隨機水平移動區塊並偏移色彩通道，每秒變化數次。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>故障</h1><p class="meta"><a href="index.html#cat-distort">扭曲</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/glitch.webp" width="192" height="192" alt="故障 特效的預覽"><p>隨機水平移動區塊並偏移色彩通道，每秒變化數次。</p><p>故障效果會每秒數次將畫面的水平色帶左右位移，並分離色彩通道。<strong>強度</strong>是效果的強烈程度，<strong>區塊高度</strong>是色帶的高度，<strong>隨機種子</strong>會選擇不同的隨機圖案。在切換鏡頭時，將強度從 0 往上動畫，即可做出短暫的數位故障效果。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.5</td></tr><tr><td data-label="設定項目"><strong>區塊高度</strong></td><td data-label="類型">數字</td><td data-label="範圍">4 至 80</td><td data-label="預設值">20</td></tr><tr><td data-label="設定項目"><strong>隨機種子</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1000</td><td data-label="預設值">0</td></tr></tbody></table></div><nav class="pager" aria-label="更多 扭曲 特效"><a rel="prev" href="innerpinchbulge.html">&larr; 內部收縮／膨脹</a><a rel="next" href="noisedisplace.html">雜訊位移 &rarr;</a></nav></main></div></body></html>
