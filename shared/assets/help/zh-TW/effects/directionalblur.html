<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方向模糊 | AbsentMotion</title><meta name="description" content="沿指定角度對取樣值取平均，產生動態模糊。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>方向模糊</h1><p class="meta"><a href="index.html#cat-blur">模糊</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/directionalblur.webp" width="192" height="192" alt="方向模糊 特效的預覽"><p>沿指定角度對取樣值取平均，產生動態模糊。</p><p>方向模糊會沿單一方向拖曳圖層。<strong>長度</strong>是拖曳的距離，<strong>角度</strong>是方向。這是固定的模糊效果：若要讓模糊跟隨圖層實際的移動，請使用<a href="../effects/motionblur.html">動態模糊</a>。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>長度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 2000</td><td data-label="預設值">20</td></tr><tr><td data-label="設定項目"><strong>角度</strong></td><td data-label="類型">角度</td><td data-label="範圍">0&deg; 至 360&deg;</td><td data-label="預設值">0&deg;</td></tr></tbody></table></div><nav class="pager" aria-label="更多 模糊 特效"><a rel="prev" href="innerblur.html">&larr; 內部模糊</a><a rel="next" href="motionblur.html">動態模糊 &rarr;</a></nav></main></div></body></html>
