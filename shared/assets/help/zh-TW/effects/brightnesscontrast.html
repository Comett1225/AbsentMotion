<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亮度與對比 | AbsentMotion</title><meta name="description" content="調整圖片的亮度和對比。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>亮度與對比</h1><p class="meta"><a href="index.html#cat-color">顏色</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/brightnesscontrast.webp" width="192" height="192" alt="亮度與對比 特效的預覽"><p>調整圖片的亮度和對比。</p><p><strong>亮度</strong>會整體提亮或壓暗畫面。<strong>對比</strong>會拉開亮部與暗部（使用負值則會讓它們靠近）。請先做小幅調整：兩者的範圍都是 -1 到 1。若要更精細地控制陰影與高光，請使用<a href="../effects/levels.html">色階</a>或<a href="../effects/highlightsshadows.html">高光與陰影</a>。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>亮度</strong></td><td data-label="類型">數字</td><td data-label="範圍">-1 至 1</td><td data-label="預設值">0.1</td></tr><tr><td data-label="設定項目"><strong>對比</strong></td><td data-label="類型">數字</td><td data-label="範圍">-1 至 5</td><td data-label="預設值">0.3</td></tr><tr><td data-label="設定項目"><strong>樣式</strong></td><td data-label="類型">選項</td><td data-label="範圍">各色版、保留顏色</td><td data-label="預設值">各色版</td></tr></tbody></table></div><nav class="pager" aria-label="更多 顏色 特效"><a rel="prev" href="hsl.html">&larr; HSL</a><a rel="next" href="solidcolor.html">純色 &rarr;</a></nav></main></div></body></html>
