<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>擺動 | AbsentMotion</title><meta name="description" content="讓圖層沿指定角度、深度或軌道來回移動。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>擺動</h1><p class="meta"><a href="index.html#cat-move">移動</a> &middot; 新增於版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/oscillate.webp" width="192" height="192" alt="擺動 特效的預覽"><p>讓圖層沿指定角度、深度或軌道來回移動。</p><p>擺動會讓圖層自行前後移動。<strong>方向</strong>可選擇沿著<strong>角度</strong>移動、在<strong>深度</strong>方向移動，或以<strong>軌道</strong>的方式移動。<strong>頻率</strong>是每秒擺動的次數，<strong>幅度</strong>是移動的距離，<strong>波形</strong>則是正弦（平滑）或三角（速度穩定）。使用<strong>相位</strong>來偏移多個圖層，讓它們不會一起移動。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>方向</strong></td><td data-label="類型">選項</td><td data-label="範圍">角度、深度、軌道</td><td data-label="預設值">角度</td></tr><tr><td data-label="設定項目"><strong>角度</strong></td><td data-label="類型">角度</td><td data-label="範圍">-3600&deg; 至 3600&deg;</td><td data-label="預設值">45&deg;</td></tr><tr><td data-label="設定項目"><strong>頻率</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 Hz 至 16 Hz</td><td data-label="預設值">2 Hz</td></tr><tr><td data-label="設定項目"><strong>幅度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 4000</td><td data-label="預設值">25</td></tr><tr><td data-label="設定項目"><strong>波形</strong></td><td data-label="類型">選項</td><td data-label="範圍">正弦、三角</td><td data-label="預設值">正弦</td></tr><tr><td data-label="設定項目"><strong>相位</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1000</td><td data-label="預設值">0</td></tr></tbody></table></div><nav class="pager" aria-label="更多 移動 特效"><a rel="prev" href="randomjitter.html">&larr; 隨機抖動</a><a rel="next" href="swing.html">擺動 &rarr;</a></nav></main></div></body></html>
