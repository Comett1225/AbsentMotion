<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模糊 | AbsentMotion</title><meta name="description" content="平滑均勻的模糊。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>模糊</h1><p class="meta"><a href="index.html#cat-blur">模糊</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/blur.webp" width="192" height="192" alt="模糊 特效的預覽"><p>平滑均勻的模糊。</p><p><strong>強度</strong>是模糊的大小：0 表示清晰，數字越高，圖層就越柔和。它適用於照片、影片、形狀、文字與群組。</p>
<ul><li>將強度從高數值動畫到 0，讓標題或照片慢慢對焦。</li><li>若要模糊圖層後方的所有內容，請先加入<a href="../effects/copybackground.html">複製背景</a>，再於其後加入模糊。</li><li>若要沿著移動方向模糊，請使用<a href="../effects/motionblur.html">動態模糊</a>。若要保持輪廓清晰，請使用<a href="../effects/innerblur.html">內部模糊</a>。</li></ul><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 300</td><td data-label="預設值">10</td></tr></tbody></table></div><nav class="pager" aria-label="更多 模糊 特效"><span></span><a rel="next" href="innerblur.html">內部模糊 &rarr;</a></nav></main></div></body></html>
