<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>銳利化 | AbsentMotion</title><meta name="description" content="使用3x3鄰近像素套用遮色片銳利化，強化細節。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>銳利化</h1><p class="meta"><a href="index.html#cat-stylize">風格化</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/sharpen.webp" width="192" height="192" alt="銳利化 特效的預覽"><p>使用3x3鄰近像素套用遮色片銳利化，強化細節。</p><p>銳利化會突顯細節。<strong>強度</strong>是增強的程度，<strong>半徑</strong>是銳化邊緣的寬度。過度使用會讓邊緣周圍出現光暈。若想使用不同的銳化方式，請試試<a href="../effects/unsharpmask.html">反遮罩銳化</a>。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 20</td><td data-label="預設值">1</td></tr><tr><td data-label="設定項目"><strong>半徑</strong></td><td data-label="類型">數字</td><td data-label="範圍">0.5 至 10</td><td data-label="預設值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多 風格化 特效"><a rel="prev" href="particles.html">&larr; 粒子</a><a rel="next" href="vignette.html">暈映 &rarr;</a></nav></main></div></body></html>
