<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亮度鍵 | AbsentMotion</title><meta name="description" content="移除圖層的暗部或亮部。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>亮度鍵</h1><p class="meta"><a href="index.html#cat-key">去背</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/lumakey.webp" width="192" height="192" alt="亮度鍵 特效的預覽"><p>移除圖層的暗部或亮部。</p><p>亮度鍵會讓圖層中較暗的部分變透明（開啟<strong>反相</strong>時則是較亮的部分）。<strong>臨界值</strong>是切除的亮度位置，<strong>柔和度</strong>是切除漸變的程度。它適用於在黑色背景上拍攝的火焰、煙霧或火花，或搭配反轉使用白色背景。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>臨界值</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.3</td></tr><tr><td data-label="設定項目"><strong>柔和度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.1</td></tr><tr><td data-label="設定項目"><strong>反相</strong></td><td data-label="類型">開或關</td><td data-label="範圍">&ndash;</td><td data-label="預設值">關</td></tr></tbody></table></div><nav class="pager" aria-label="更多 去背 特效"><a rel="prev" href="keyspillcleaner.html">&larr; 去除溢色</a><a rel="next" href="lumastamper.html">亮度印章 &rarr;</a></nav></main></div></body></html>
