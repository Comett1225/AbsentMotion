<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曝光 | AbsentMotion</title><meta name="description" content="透過曝光級數、偏移及伽瑪校正模擬攝影曝光。「提亮半透明部分」可讓模糊邊緣等半透明像素的亮度超過白色。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>曝光</h1><p class="meta"><a href="index.html#cat-color">顏色</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/exposure.webp" width="192" height="192" alt="曝光 特效的預覽"><p>透過曝光級數、偏移及伽瑪校正模擬攝影曝光。「提亮半透明部分」可讓模糊邊緣等半透明像素的亮度超過白色。</p><p><strong>曝光級數</strong>讓畫面像相機一樣變亮或變暗：一級會讓光量加倍或減半，範圍從 -4 到 4。<strong>偏移</strong>會均勻地提高或降低所有內容，<strong>伽瑪</strong>則會改變中間調。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>曝光級數</strong></td><td data-label="類型">數字</td><td data-label="範圍">-4 至 4</td><td data-label="預設值">0.7</td></tr><tr><td data-label="設定項目"><strong>偏移</strong></td><td data-label="類型">數字</td><td data-label="範圍">-0.5 至 0.5</td><td data-label="預設值">0</td></tr><tr><td data-label="設定項目"><strong>伽瑪</strong></td><td data-label="類型">數字</td><td data-label="範圍">0.1 至 10</td><td data-label="預設值">1</td></tr><tr><td data-label="設定項目"><strong>提亮半透明部分</strong></td><td data-label="類型">開或關</td><td data-label="範圍">&ndash;</td><td data-label="預設值">關</td></tr></tbody></table></div><nav class="pager" aria-label="更多 顏色 特效"><a rel="prev" href="gradientmap.html">&larr; 漸層映射</a><a rel="next" href="invert.html">反相 &rarr;</a></nav></main></div></body></html>
