<!doctype html>
<html lang="zh-TW" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>底片顆粒 | AbsentMotion</title><meta name="description" content="動態單色底片顆粒，可調整數量、顆粒大小及動畫速度。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="說明"><a href="../index.html">目錄</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>底片顆粒</h1><p class="meta"><a href="index.html#cat-noise">雜訊</a> &middot; 新增於 2.1.0 版或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/filmgrain.webp" width="192" height="192" alt="底片顆粒 特效的預覽"><p>動態單色底片顆粒，可調整數量、顆粒大小及動畫速度。</p><p>底片顆粒會加入動態的老式底片顆粒。<strong>數量</strong>是顆粒的可見程度，<strong>顆粒大小</strong>是顆粒的粗細，<strong>速度</strong>是閃爍的快慢；設為 0 時，顆粒會保持靜止。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>類型</th><th>範圍</th><th>預設值</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>數量</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 1</td><td data-label="預設值">0.5</td></tr><tr><td data-label="設定項目"><strong>顆粒大小</strong></td><td data-label="類型">數字</td><td data-label="範圍">1 至 8</td><td data-label="預設值">4</td></tr><tr><td data-label="設定項目"><strong>速度</strong></td><td data-label="類型">數字</td><td data-label="範圍">0 至 5</td><td data-label="預設值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多 雜訊 特效"><span></span><a rel="next" href="turbulence.html">紊流 &rarr;</a></nav></main></div></body></html>
