<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷页 | AbsentMotion</title><meta name="description" content="像翻书一样翻转图层：一角抬起并卷起，露出页面背面。为“进度”添加动画即可翻页。开启“跟随形状”后，页面会从可见内容的边缘翻起，圆形图片或 3D 模型会从自身边缘卷起，而不是从看不见的方框卷起。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>卷页</h1><p class="meta"><a href="index.html#cat-distort">扭曲</a> &middot; 添加于版本 5.1.0</p><img class="fx-thumb" src="../../../effects/thumb/pagecurl.webp" width="192" height="192" alt="卷页 特效预览"><p>像翻书一样翻转图层：一角抬起并卷起，露出页面背面。为“进度”添加动画即可翻页。开启“跟随形状”后，页面会从可见内容的边缘翻起，圆形图片或 3D 模型会从自身边缘卷起，而不是从看不见的方框卷起。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>进度</strong></td><td data-label="类型">数字</td><td data-label="范围">0% 至 100%</td><td data-label="默认值">50%</td></tr><tr><td data-label="设置项"><strong>半径</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.1</td></tr><tr><td data-label="设置项"><strong>角度</strong></td><td data-label="类型">角度</td><td data-label="范围">-3600&deg; 至 3600&deg;</td><td data-label="默认值">38&deg;</td></tr><tr><td data-label="设置项"><strong>背面颜色</strong></td><td data-label="类型">颜色</td><td data-label="范围">&ndash;</td><td data-label="默认值"><span><span class="sw" style="background:#888888"></span>#888888</span></td></tr><tr><td data-label="设置项"><strong>背面不透明度</strong></td><td data-label="类型">数字</td><td data-label="范围">0% 至 100%</td><td data-label="默认值">100%</td></tr><tr><td data-label="设置项"><strong>光泽</strong></td><td data-label="类型">数字</td><td data-label="范围">0% 至 100%</td><td data-label="默认值">100%</td></tr><tr><td
