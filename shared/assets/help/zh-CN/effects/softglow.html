<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柔光晕 | AbsentMotion</title><meta name="description" content="将柔和模糊的图片副本以滤色模式叠加，主要从高光处产生梦幻光晕。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>柔光晕</h1><p class="meta"><a href="index.html#cat-stylize">风格化</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/softglow.webp" width="192" height="192" alt="柔光晕 特效预览"><p>将柔和模糊的图片副本以滤色模式叠加，主要从高光处产生梦幻光晕。</p><p>柔光会在画面上叠加一个模糊的副本，形成梦幻般朦胧的效果，主要来自高光部分。<strong>大小</strong>决定朦胧的柔和程度，<strong>高光</strong>决定它有多少来自明亮部分，<strong>颜色</strong>为其着色。<strong>不透明度</strong>控制它与原始画面的混合程度。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>大小</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 300</td><td data-label="默认值">20</td></tr><tr><td data-label="设置项"><strong>亮度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 3</td><td data-label="默认值">1</td></tr><tr><td data-label="设置项"><strong>对比度</strong></td><td data-label="类型">数字</td><td data-label="范围">-1 至 1</td><td data-label="默认值">0.2</td></tr><tr><td data-label="设置项"><strong>高光</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.5</td></tr><tr><td data-label="设置项"><strong>颜色</strong></td><td data-label="类型">颜色</td><td data-label="范围">&ndash;</td><td data-label="默认值"><span><span class="sw" style="background:#ff5566"></span>#FF5566</span></td></tr><tr><td data-label="设置项"><strong>混合</strong></td><td data-label="类型">数字</td><td data-label="范围">0% 至 100%</td><td data-label="默认值">25%</td></tr><tr><td data-label="设置项"><strong>不透明度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">1</td></tr><tr><td data-label="设置项"><strong>外部光晕</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多风格化特效"><a rel="prev" href="lightglow.html">&larr; 亮部发光</a><a rel="next" href="deepglow.html">深度辉光 &rarr;</a></nav></main></div></body></html>
