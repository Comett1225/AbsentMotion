<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>胶片颗粒 | AbsentMotion</title><meta name="description" content="动态黑白胶片颗粒，可调整数量、颗粒大小和动画速度。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>胶片颗粒</h1><p class="meta"><a href="index.html#cat-noise">噪点</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/filmgrain.webp" width="192" height="192" alt="胶片颗粒 特效预览"><p>动态黑白胶片颗粒，可调整数量、颗粒大小和动画速度。</p><p>胶片颗粒会添加类似老式胶片的动态颗粒。<strong>数量</strong>决定颗粒的明显程度，<strong>颗粒大小</strong>决定颗粒的粗细，<strong>速度</strong>决定闪烁的快慢；设为 0 时颗粒静止不动。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>数量</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.5</td></tr><tr><td data-label="设置项"><strong>颗粒大小</strong></td><td data-label="类型">数字</td><td data-label="范围">1 至 8</td><td data-label="默认值">4</td></tr><tr><td data-label="设置项"><strong>速度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 5</td><td data-label="默认值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多噪点特效"><span></span><a rel="next" href="turbulence.html">湍流 &rarr;</a></nav></main></div></body></html>
