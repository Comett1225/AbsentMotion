<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>缩放模糊 | AbsentMotion</title><meta name="description" content="沿中心点向外的射线对采样取平均，生成强度可调的径向缩放模糊。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>缩放模糊</h1><p class="meta"><a href="index.html#cat-blur">模糊</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/radialblur.webp" width="192" height="192" alt="缩放模糊 特效预览"><p>沿中心点向外的射线对采样取平均，生成强度可调的径向缩放模糊。</p><p>缩放模糊会从一个点向外拖出画面，效果如同推动摄像机变焦。<strong>中心</strong>是该点，<strong>强度</strong>决定拖影的长度。为强度添加动画即可产生快速缩放转场。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>中心</strong></td><td data-label="类型">点（X, Y）</td><td data-label="范围">&ndash;</td><td data-label="默认值">0.5, 0.5</td></tr><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1.9</td><td data-label="默认值">0.15</td></tr></tbody></table></div><nav class="pager" aria-label="更多模糊特效"><a rel="prev" href="smear.html">&larr; 拖抹</a><a rel="next" href="chromaticzoomblur.html">色散缩放模糊 &rarr;</a></nav></main></div></body></html>
