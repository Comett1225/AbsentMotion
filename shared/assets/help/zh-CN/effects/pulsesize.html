<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大小脉冲 | AbsentMotion</title><meta name="description" content="按正弦波或三角波反复放大和缩小图层。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>大小脉冲</h1><p class="meta"><a href="index.html#cat-move">移动</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/pulsesize.webp" width="192" height="192" alt="大小脉冲 特效预览"><p>按正弦波或三角波反复放大和缩小图层。</p><p>脉动大小会使图层反复放大和缩小。<strong>缩小</strong>和<strong>放大</strong>是相对于正常大小的最小和最大倍数（0.9 即 90%），<strong>频率</strong>是每秒脉动的次数，<strong>波形</strong>为正弦（平滑）或三角形。心跳效果或与节拍同步的标志是常见用途。另请参见<a href="../effects/pulseopacity.html">脉动不透明度</a>。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>频率</strong></td><td data-label="类型">数字</td><td data-label="范围">0 Hz 至 16 Hz</td><td data-label="默认值">2 Hz</td></tr><tr><td data-label="设置项"><strong>缩小</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.9</td></tr><tr><td data-label="设置项"><strong>放大</strong></td><td data-label="类型">数字</td><td data-label="范围">1 至 2</td><td data-label="默认值">1.1</td></tr><tr><td data-label="设置项"><strong>起始相位</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 2</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>波形</strong></td><td data-label="类型">选项</td><td data-label="范围">正弦波，三角波</td><td data-label="默认值">正弦波</td></tr></tbody></table></div><nav class="pager" aria-label="更多移动特效"><a rel="prev" href="spin.html">&larr; 旋转</a><a rel="next" href="pulseopacity.html">不透明度脉冲 &rarr;</a></nav></main></div></body></html>
