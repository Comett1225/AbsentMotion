<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>颜色平衡 | AbsentMotion</title><meta name="description" content="分别调整阴影、中间调和高光的颜色（灰色保持对应范围不变）。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>颜色平衡</h1><p class="meta"><a href="index.html#cat-color">颜色</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/colorbalance.webp" width="192" height="192" alt="颜色平衡 特效预览"><p>分别调整阴影、中间调和高光的颜色（灰色保持对应范围不变）。</p><p>三个色块<strong>阴影</strong>、<strong>中间调</strong>和<strong>高光</strong>会分别把画面的暗部、中间调和亮部推向各自的颜色。灰色色块会使该范围保持不变。<strong>数量</strong>决定结果与原始画面的混合程度。默认效果是青橙色调：阴影偏冷，高光偏暖。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>阴影</strong></td><td data-label="类型">颜色</td><td data-label="范围">&ndash;</td><td data-label="默认值"><span><span class="sw" style="background:#3060a0"></span>#3060A0</span></td></tr><tr><td data-label="设置项"><strong>中间调</strong></td><td data-label="类型">颜色</td><td data-label="范围">&ndash;</td><td data-label="默认值"><span><span class="sw" style="background:#808080"></span>#808080</span></td></tr><tr><td data-label="设置项"><strong>高光</strong></td><td data-label="类型">颜色</td><td data-label="范围">&ndash;</td><td data-label="默认值"><span><span class="sw" style="background:#ffb070"></span>#FFB070</span></td></tr><tr><td data-label="设置项"><strong>数量</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.5</td></tr></tbody></table></div><nav class="pager" aria-label="更多颜色特效"><a rel="prev" href="fourcolorgradient.html">&larr; 四色渐变</a><a rel="next" href="liftgammagain.html">阴影伽马增益 &rarr;</a></nav></main></div></body></html>
