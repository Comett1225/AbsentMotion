<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色阶 | AbsentMotion</title><meta name="description" content="通过输入黑白场、伽马和输出黑白场调整图片色阶。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>色阶</h1><p class="meta"><a href="index.html#cat-color">颜色</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/levels.webp" width="192" height="192" alt="色阶 特效预览"><p>通过输入黑白场、伽马和输出黑白场调整图片色阶。</p><p>色阶用于设定哪一亮度变为纯黑和纯白。提高<strong>输入黑场</strong>可使阴影更暗，降低<strong>输入白场</strong>可使高光更亮。<strong>伽马</strong>会改变中间调，而不影响黑白点。<strong>输出黑场</strong>和<strong>输出白场</strong>限制最终的范围，可形成褪色效果。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>输入黑场</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.1</td></tr><tr><td data-label="设置项"><strong>输入白场</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.85</td></tr><tr><td data-label="设置项"><strong>伽马</strong></td><td data-label="类型">数字</td><td data-label="范围">0.2 至 5</td><td data-label="默认值">1</td></tr><tr><td data-label="设置项"><strong>输出黑场</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>输出白场</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多颜色特效"><a rel="prev" href="invert.html">&larr; 反相</a><a rel="next" href="posterize.html">色调分离 &rarr;</a></nav></main></div></body></html>
