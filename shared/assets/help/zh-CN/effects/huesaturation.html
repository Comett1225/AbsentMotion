<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色相和饱和度 | AbsentMotion</title><meta name="description" content="沿色轮改变颜色并调整其浓淡；自然饱和度主要增强较暗淡的颜色。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>色相和饱和度</h1><p class="meta"><a href="index.html#cat-color">颜色</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/huesaturation.webp" width="192" height="192" alt="色相和饱和度 特效预览"><p>沿色轮改变颜色并调整其浓淡；自然饱和度主要增强较暗淡的颜色。</p><p><strong>色相</strong>会使每种颜色在色轮上旋转（一整圈为 360 度）。<strong>饱和度</strong>使颜色更浓或更淡：降低至 0 可去除颜色，调高则更鲜艳。<strong>自然饱和度</strong>会优先提升较为暗淡的颜色，<strong>明度</strong>则使画面变亮或变暗。</p>
<p>为色相添加动画即可产生彩虹色循环。若要黑白效果，请将饱和度降至 0。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>色相</strong></td><td data-label="类型">角度</td><td data-label="范围">-360&deg; 至 360&deg;</td><td data-label="默认值">60&deg;</td></tr><tr><td data-label="设置项"><strong>饱和度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 3</td><td data-label="默认值">1.4</td></tr><tr><td data-label="设置项"><strong>自然饱和度</strong></td><td data-label="类型">数字</td><td data-label="范围">-1 至 1</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>明度</strong></td><td data-label="类型">数字</td><td data-label="范围">-1 至 1</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>样式</strong></td><td data-label="类型">选项</td><td data-label="范围">经典，保留亮度</td><td data-label="默认值">经典</td></tr></tbody></table></div><nav class="pager" aria-label="更多颜色特效"><span></span><a rel="next" href="hsl.html">HSL &rarr;</a></nav></main></div></body></html>
