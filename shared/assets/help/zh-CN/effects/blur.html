<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模糊 | AbsentMotion</title><meta name="description" content="平滑均匀的模糊效果。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>模糊</h1><p class="meta"><a href="index.html#cat-blur">模糊</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/blur.webp" width="192" height="192" alt="模糊 特效预览"><p>平滑均匀的模糊效果。</p><p><strong>强度</strong>是模糊的大小：0 为清晰，数值越大，图层越柔和。它适用于照片、视频、形状、文本和组。</p>
<ul><li>将强度从较大的数值动画到 0，使标题或照片逐渐清晰对焦。</li><li>若要模糊图层后方的所有内容，请先添加<a href="../effects/copybackground.html">复制背景</a>，然后在其后添加模糊。</li><li>若要沿运动方向模糊，请使用<a href="../effects/motionblur.html">运动模糊</a>。若要保持轮廓清晰，请使用<a href="../effects/innerblur.html">内部模糊</a>。</li></ul><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 300</td><td data-label="默认值">10</td></tr></tbody></table></div><nav class="pager" aria-label="更多模糊特效"><span></span><a rel="next" href="innerblur.html">内部模糊 &rarr;</a></nav></main></div></body></html>
