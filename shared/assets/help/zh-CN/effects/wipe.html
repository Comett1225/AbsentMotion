<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>擦除 | AbsentMotion</title><meta name="description" content="从相对的两侧隐藏图层。为开始或结束添加动画可制作擦除转场。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>擦除</h1><p class="meta"><a href="index.html#cat-key">抠像</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/wipe.webp" width="192" height="192" alt="擦除 特效预览"><p>从相对的两侧隐藏图层。为开始或结束添加动画可制作擦除转场。</p><p>擦除会从两个相对的方向隐藏图层。为<strong>开始</strong>或<strong>结束</strong>添加动画，即可用直线边缘显示或移除图层；<strong>角度</strong>是边缘的方向，<strong>羽化</strong>使其柔和。若想要像时钟指针那样的擦除效果，请使用<a href="../effects/radialwipe.html">径向擦除</a>。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>开始</strong></td><td data-label="类型">数字</td><td data-label="范围">-50% 至 150%</td><td data-label="默认值">0%</td></tr><tr><td data-label="设置项"><strong>结束</strong></td><td data-label="类型">数字</td><td data-label="范围">-50% 至 150%</td><td data-label="默认值">100%</td></tr><tr><td data-label="设置项"><strong>角度</strong></td><td data-label="类型">角度</td><td data-label="范围">-3600&deg; 至 3600&deg;</td><td data-label="默认值">0&deg;</td></tr><tr><td data-label="设置项"><strong>羽化</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 100</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>柔和度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 % 至 100 %</td><td data-label="默认值">0 %</td></tr></tbody></table></div><nav class="pager" aria-label="更多抠像特效"><a rel="prev" href="crop.html">&larr; 裁剪</a><a rel="next" href="feather.html">羽化 &rarr;</a></nav></main></div></body></html>
