<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>故障 | AbsentMotion</title><meta name="description" content="随机水平错位色块和偏移颜色通道，每秒变化数次。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>故障</h1><p class="meta"><a href="index.html#cat-distort">扭曲</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/glitch.webp" width="192" height="192" alt="故障 特效预览"><p>随机水平错位色块和偏移颜色通道，每秒变化数次。</p><p>故障会使画面的水平条带左右错位，并每秒数次拆分颜色通道。<strong>强度</strong>决定其强弱，<strong>色块高度</strong>决定条带的高度，<strong>随机种子</strong>则选择不同的随机图案。将强度从 0 开始动画增大，即可在切换镜头时产生短暂的数字故障效果。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.5</td></tr><tr><td data-label="设置项"><strong>色块高度</strong></td><td data-label="类型">数字</td><td data-label="范围">4 至 80</td><td data-label="默认值">20</td></tr><tr><td data-label="设置项"><strong>随机种子</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1000</td><td data-label="默认值">0</td></tr></tbody></table></div><nav class="pager" aria-label="更多扭曲特效"><a rel="prev" href="innerpinchbulge.html">&larr; 内部收缩／膨胀</a><a rel="next" href="noisedisplace.html">噪声置换 &rarr;</a></nav></main></div></body></html>
