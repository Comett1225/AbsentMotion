<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>波浪扭曲 | AbsentMotion</title><meta name="description" content="用正弦波扭曲图层：间距控制波浪数量，幅度控制位移距离，角度控制波浪方向，扭曲角度控制位移方向。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>波浪扭曲</h1><p class="meta"><a href="index.html#cat-distort">扭曲</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/wavewarp.webp" width="192" height="192" alt="波浪扭曲 特效预览"><p>用正弦波扭曲图层：间距控制波浪数量，幅度控制位移距离，角度控制波浪方向，扭曲角度控制位移方向。</p><p>波浪扭曲会用波浪使图层弯曲。<strong>间距</strong>是波浪之间的距离，<strong>幅度</strong>决定它们推动画面的距离，<strong>角度</strong>是波浪延伸的方向，<strong>扭曲角度</strong>是它们推动的方向。为<strong>相位</strong>添加动画可使波浪移动，或设置<strong>速度</strong>让其自行运动。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>相位</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 500</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>角度</strong></td><td data-label="类型">角度</td><td data-label="范围">-3600&deg; 至 3600&deg;</td><td data-label="默认值">0&deg;</td></tr><tr><td data-label="设置项"><strong>间距</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 500</td><td data-label="默认值">20</td></tr><tr><td data-label="设置项"><strong>幅度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 30</td><td data-label="默认值">4</td></tr><tr><td data-label="设置项"><strong>扭曲角度</strong></td><td data-label="类型">角度</td><td data-label="范围">-3600&deg; 至 3600&deg;</td><td data-label="默认值">90&deg;</td></tr><tr><td data-label="设置项"><strong>速度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 10</td><td data-label="默认值">0</td></tr></tbody></table></div><nav class="pager" aria-label="更多扭曲特效"><a rel="prev" href="circularripple.html">&larr; 圆形波纹</a><a rel="next" href="turbulentdisplace.html">湍流置换 &rarr;</a></nav></main></div></body></html>
