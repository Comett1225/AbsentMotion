<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>溶解 | AbsentMotion</title><meta name="description" content="随机移除图层中的像素或色块。为强度添加动画可制作溶解转场；随机种子决定图案，大小决定每个斑点的尺寸。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>溶解</h1><p class="meta"><a href="index.html#cat-noise">噪点</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/dissolve.webp" width="192" height="192" alt="溶解 特效预览"><p>随机移除图层中的像素或色块。为强度添加动画可制作溶解转场；随机种子决定图案，大小决定每个斑点的尺寸。</p><p>溶解会从图层中移除随机的斑点。将<strong>强度</strong>从 0 动画到 1，即可形成溶解转场。<strong>大小</strong>是每个斑点的尺寸，<strong>随机种子</strong>决定图案。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.75</td></tr><tr><td data-label="设置项"><strong>随机种子</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 5</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>大小</strong></td><td data-label="类型">数字</td><td data-label="范围">1 至 200</td><td data-label="默认值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多噪点特效"><a rel="prev" href="fractalridges.html">&larr; 分形山脊</a><a rel="next" href="blockdissolve.html">方块溶解 &rarr;</a></nav></main></div></body></html>
