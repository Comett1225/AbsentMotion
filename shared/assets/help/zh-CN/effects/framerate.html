<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帧率 | AbsentMotion</title><meta name="description" content="降低图层帧率，呈现卡顿或定格动画的效果。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>帧率</h1><p class="meta"><a href="index.html#cat-move">移动</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/timequant.webp" width="192" height="192" alt="帧率 特效预览"><p>降低图层帧率，呈现卡顿或定格动画的效果。</p><p>帧率：使图层以较低的帧率运动，形成断续的定格动画效果。它适用于视频、形状、文本和组。设置图层应显示的每秒帧数：数字越低，动作越断续。</p>
