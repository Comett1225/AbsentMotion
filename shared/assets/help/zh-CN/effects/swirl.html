<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旋涡 | AbsentMotion</title><meta name="description" content="将图层围绕中心扭成旋涡，中心效果最强，到半径处逐渐消失。半径按图层尺寸的比例计算，强度为负值时反向扭曲。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>旋涡</h1><p class="meta"><a href="index.html#cat-distort">扭曲</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/twirl.webp" width="192" height="192" alt="旋涡 特效预览"><p>将图层围绕中心扭成旋涡，中心效果最强，到半径处逐渐消失。半径按图层尺寸的比例计算，强度为负值时反向扭曲。</p><p>漩涡会让图层围绕一个点扭转，如同旋涡。<strong>中心</strong>是扭转的中心，<strong>强度</strong>决定扭转的程度（负值则反向扭转），<strong>半径</strong>决定其影响到距中心多远。为强度添加从 0 开始的动画，即可形成螺旋转场。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>中心</strong></td><td data-label="类型">点（X, Y）</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.5, 0.5</td></tr><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">-0.5 至 0.5</td><td data-label="默认值">0.1</td></tr><tr><td data-label="设置项"><strong>半径</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 3</td><td data-label="默认值">0.3</td></tr></tbody></table></div><nav class="pager" aria-label="更多扭曲特效"><span></span><a rel="next" href="pinchbulge.html">收缩/膨胀 &rarr;</a></nav></main></div></body></html>
