<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亮度抠像 | AbsentMotion</title><meta name="description" content="移除图层的暗部（或亮部）。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>亮度抠像</h1><p class="meta"><a href="index.html#cat-key">抠像</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/lumakey.webp" width="192" height="192" alt="亮度抠像 特效预览"><p>移除图层的暗部（或亮部）。</p><p>亮度抠像会使图层中较暗的部分变为透明（启用<strong>反相</strong>后则是较亮的部分）。<strong>阈值</strong>是抠除的亮度界限，<strong>柔和度</strong>决定抠除过渡的渐变程度。它适用于在黑色背景下拍摄的火焰、烟雾或火花素材，或配合反相用于白色背景。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>阈值</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.3</td></tr><tr><td data-label="设置项"><strong>柔和度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.1</td></tr><tr><td data-label="设置项"><strong>反相</strong></td><td data-label="类型">开或关</td><td data-label="范围">&ndash;</td><td data-label="默认值">关</td></tr></tbody></table></div><nav class="pager" aria-label="更多抠像特效"><a rel="prev" href="keyspillcleaner.html">&larr; 抠像溢色清除</a><a rel="next" href="lumastamper.html">亮度印章 &rarr;</a></nav></main></div></body></html>
