<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重复器 | AbsentMotion</title><meta name="description" content="动态生成多个图层副本。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>重复器</h1><p class="meta"><a href="index.html#cat-repeat">重复</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/repeat.webp" width="192" height="192" alt="重复器 特效预览"><p>动态生成多个图层副本。</p><p>重复会将图层复制多份，一个接一个排列。<strong>数量</strong>是副本的个数，<strong>偏移</strong>是每个副本相对于前一个副本移动的距离，<strong>角度</strong>和<strong>缩放</strong>分别决定每个副本的旋转和放大程度，<strong>时间</strong>会让每个副本延迟出现，使它们像拖尾一样跟随图层。其他排列方式请参见<a href="../effects/linearrepeat.html">线性重复</a>、<a href="../effects/radialrepeat.html">径向重复</a>和<a href="../effects/gridrepeat.html">网格重复</a>。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>数量</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 9999</td><td data-label="默认值">10</td></tr><tr><td data-label="设置项"><strong>时间</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 9999</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>偏移</strong></td><td data-label="类型">点（X, Y）</td><td data-label="范围">-99999 至 99999</td><td data-label="默认值">0, 0</td></tr><tr><td data-label="设置项"><strong>角度</strong></td><td data-label="类型">角度</td><td data-label="范围">-3600&deg; 至 3600&deg;</td><td data-label="默认值">0&deg;</td></tr><tr><td data-label="设置项"><strong>缩放</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 10</td><td data-label="默认值">1</td></tr><tr><td data-label="设置项"><strong>透明度</strong></td><td data-label="类型">数字</td><td data-label="范围">0% 至 100%</td><td data-label="默认值">100%</td></tr></tbody></table></div><nav class="pager" aria-label="更多重复特效"><a rel="prev" href="tile.html">&larr; 平铺</a><a rel="next" href="videofeedback.html">视频反馈 &rarr;</a></nav></main></div></body></html>
