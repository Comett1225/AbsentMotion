<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随机位移 | AbsentMotion</title><meta name="description" content="让图层随时间平滑随机移动。随机种子选择不同的运动轨迹，速度控制移动快慢，演变改变运动模式。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>随机位移</h1><p class="meta"><a href="index.html#cat-move">移动</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/randomdisplace.webp" width="192" height="192" alt="随机位移 特效预览"><p>让图层随时间平滑随机移动。随机种子选择不同的运动轨迹，速度控制移动快慢，演变改变运动模式。</p><p>随机位移会让图层平滑而随机地移动，就像漂移的摄像机。<strong>幅度</strong>决定其游移的距离，<strong>速度</strong>决定其快慢，<strong>随机种子</strong>则选择不同的路径。与<a href="../effects/autoshake.html">自动抖动</a>不同，此运动缓慢而流畅，而非跳跃式。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>幅度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 2000</td><td data-label="默认值">50</td></tr><tr><td data-label="设置项"><strong>演变</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 2000</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>随机种子</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 5</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>散布</strong></td><td data-label="类型">数字</td><td data-label="范围">0% 至 200%</td><td data-label="默认值">50%</td></tr><tr><td data-label="设置项"><strong>速度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 50</td><td data-label="默认值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多移动特效"><a rel="prev" href="autoshake.html">&larr; 自动抖动</a><a rel="next" href="randomjitter.html">随机抖动 &rarr;</a></nav></main></div></body></html>
