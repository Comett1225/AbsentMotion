<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亮部发光 | AbsentMotion</title><meta name="description" content="在画面中亮度高于阈值的部分周围添加彩色发光。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>亮部发光</h1><p class="meta"><a href="index.html#cat-stylize">风格化</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/lightglow.webp" width="192" height="192" alt="亮部发光 特效预览"><p>在画面中亮度高于阈值的部分周围添加彩色发光。</p><p>亮部发光只在画面比<strong>阈值</strong>更亮的地方产生光晕。降低阈值可使画面中更多的区域发光，提高<strong>强度</strong>可增强光晕，调整<strong>大小</strong>可改变光晕扩散的范围。<strong>颜色</strong>为光晕着色。</p>
<p>适用于夜景、灯光、霓虹灯和明亮的高光。若要为形状添加光晕，请使用<a href="../effects/glow.html">发光</a>。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>大小</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 300</td><td data-label="默认值">90</td></tr><tr><td data-label="设置项"><strong>阈值</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.6</td></tr><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 10</td><td data-label="默认值">1</td></tr><tr><td data-label="设置项"><strong>颜色</strong></td><td data-label="类型">颜色</td><td data-label="范围">&ndash;</td><td data-label="默认值"><span><span class="sw" style="background:#ffe0a0"></span>#FFE0A0</span></td></tr><tr><td data-label="设置项"><strong>混合</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">1</td></tr><tr><td data-label="设置项"><strong>不透明度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多风格化特效"><a rel="prev" href="glow.html">&larr; 发光</a><a rel="next" href="softglow.html">柔光晕 &rarr;</a></nav></main></div></body></html>
