<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方块噪点 | AbsentMotion</title><meta name="description" content="在图层上闪烁随机噪点方块。正片叠底会调制现有颜色；相加会为其添加噪点。冻结可保持图案静止。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>方块噪点</h1><p class="meta"><a href="index.html#cat-noise">噪点</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/blocknoise.webp" width="192" height="192" alt="方块噪点 特效预览"><p>在图层上闪烁随机噪点方块。正片叠底会调制现有颜色；相加会为其添加噪点。冻结可保持图案静止。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>大小</strong></td><td data-label="类型">数字</td><td data-label="范围">1 至 999</td><td data-label="默认值">20</td></tr><tr><td data-label="设置项"><strong>拉伸</strong></td><td data-label="类型">点（X, Y）</td><td data-label="范围">0.01 至 10</td><td data-label="默认值">1, 1</td></tr><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.25</td></tr><tr><td data-label="设置项"><strong>单色</strong></td><td data-label="类型">开或关</td><td data-label="范围">&ndash;</td><td data-label="默认值">关</td></tr><tr><td data-label="设置项"><strong>冻结</strong></td><td data-label="类型">开或关</td><td data-label="范围">&ndash;</td><td data-label="默认值">关</td></tr><tr><td data-label="设置项"><strong>极值</strong></td><td data-label="类型">开或关</td><td data-label="范围">&ndash;</td><td data-label="默认值">关</td></tr><tr><td data-label="设置项"><strong>偏移</strong></td><td data-label="类型">点（X, Y）</td><td data-label="范围">-5000 px 至 5000 px</td><td data-label="默认值">0 px, 0 px</td></tr><tr><td data-label="设置项"><strong>过冲
