<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真实运动模糊 | AbsentMotion</title><meta name="description" content="沿图层实际移动、旋转和缩放的轨迹产生模糊，模拟相机快门；快门角度越大，拖尾越长，采样越多，拖尾越平滑。未开启完全模糊时，预览会使用更快的模糊效果。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>真实运动模糊</h1><p class="meta"><a href="index.html#cat-move">移动</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/shutterblur.webp" width="192" height="192" alt="真实运动模糊 特效预览"><p>沿图层实际移动、旋转和缩放的轨迹产生模糊，模拟相机快门；快门角度越大，拖尾越长，采样越多，拖尾越平滑。未开启完全模糊时，预览会使用更快的模糊效果。</p><p>真实运动模糊的工作方式类似相机快门。<strong>快门角度</strong>是快门开启的时长：180 度是常见的胶片效果，360 度则产生最长的拖影。<strong>采样数</strong>是混合的副本数量：数量越多越平滑，但速度越慢。</p>
<p>它会跟随图层的真实运动，包括运动特效。除非在预览条中开启<strong>完整模糊</strong>，否则预览显示的是快速近似效果。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>快门角度</strong></td><td data-label="类型">角度</td><td data-label="范围">0&deg; 至 360&deg;</td><td data-label="默认值">180&deg;</td></tr><tr><td data-label="设置项"><strong>采样数</strong></td><td data-label="类型">数字</td><td data-label="范围">2 至 32</td><td data-label="默认值">8</td></tr></tbody></table></div><nav class="pager" aria-label="更多移动特效"><a rel="prev" href="framerate.html">&larr; 帧率</a><span></span></nav></main></div></body></html>
