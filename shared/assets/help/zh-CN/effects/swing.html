<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摆动 | AbsentMotion</title><meta name="description" content="使图层在两个角度之间来回旋转。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>摆动</h1><p class="meta"><a href="index.html#cat-move">移动</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/swing.webp" width="192" height="192" alt="摆动 特效预览"><p>使图层在两个角度之间来回旋转。</p><p>摇摆会让图层在<strong>角度1</strong>和<strong>角度2</strong>之间来回摆动，<strong>频率</strong>为每秒摆动的次数。使用<strong>波形</strong>选择正弦（平滑）或三角形（速度稳定），使用<strong>相位</strong>让各图层相互错开。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>频率</strong></td><td data-label="类型">数字</td><td data-label="范围">0.1 Hz 至 16 Hz</td><td data-label="默认值">2 Hz</td></tr><tr><td data-label="设置项"><strong>角度1</strong></td><td data-label="类型">角度</td><td data-label="范围">-3600&deg; 至 3600&deg;</td><td data-label="默认值">-30&deg;</td></tr><tr><td data-label="设置项"><strong>角度2</strong></td><td data-label="类型">角度</td><td data-label="范围">-3600&deg; 至 3600&deg;</td><td data-label="默认值">30&deg;</td></tr><tr><td data-label="设置项"><strong>相位</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 2</td><td data-label="默认值">0</td></tr><tr><td data-label="设置项"><strong>波形</strong></td><td data-label="类型">选项</td><td data-label="范围">正弦，三角</td><td data-label="默认值">正弦</td></tr></tbody></table></div><nav class="pager" aria-label="更多移动特效"><a rel="prev" href="oscillate.html">&larr; 摆动</a><a rel="next" href="spin.html">旋转 &rarr;</a></nav></main></div></body></html>
