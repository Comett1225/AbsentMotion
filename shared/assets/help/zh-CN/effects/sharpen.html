<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>锐化 | AbsentMotion</title><meta name="description" content="使用3x3邻域进行反遮罩锐化，增强细节。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>锐化</h1><p class="meta"><a href="index.html#cat-stylize">风格化</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/sharpen.webp" width="192" height="192" alt="锐化 特效预览"><p>使用3x3邻域进行反遮罩锐化，增强细节。</p><p>锐化可突出细节。<strong>强度</strong>决定锐化的程度，<strong>半径</strong>决定锐化边缘的宽度。过度锐化会在边缘周围产生光晕。若想尝试其他锐化方式，可以使用<a href="../effects/unsharpmask.html">非锐化蒙版</a>。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 20</td><td data-label="默认值">1</td></tr><tr><td data-label="设置项"><strong>半径</strong></td><td data-label="类型">数字</td><td data-label="范围">0.5 至 10</td><td data-label="默认值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多风格化特效"><a rel="prev" href="particles.html">&larr; 粒子</a><a rel="next" href="vignette.html">暗角 &rarr;</a></nav></main></div></body></html>
