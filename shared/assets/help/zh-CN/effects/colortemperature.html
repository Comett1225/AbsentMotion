<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色温 | AbsentMotion</title><meta name="description" content="模拟不同开尔文色温的光线，使画面变暖或变冷；6500 K时画面不变。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>色温</h1><p class="meta"><a href="index.html#cat-color">颜色</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/temperature.webp" width="192" height="192" alt="色温 特效预览"><p>模拟不同开尔文色温的光线，使画面变暖或变冷；6500 K时画面不变。</p><p>使画面变得更暖或更冷，就像被某个以开尔文为单位的色温灯光照亮一样。<strong>色温</strong>为 6500 K 时画面保持不变。数值越低，画面越偏暖，呈橙色；数值越高，画面越偏冷，呈蓝色。<strong>强度</strong>决定结果与原始画面的混合程度。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>色温</strong></td><td data-label="类型">数字</td><td data-label="范围">1000 至 40000</td><td data-label="默认值">3200</td></tr><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">1</td></tr></tbody></table></div><nav class="pager" aria-label="更多颜色特效"><a rel="prev" href="splittone.html">&larr; 分离色调</a><a rel="next" href="duotone.html">双色调 &rarr;</a></nav></main></div></body></html>
