<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方向模糊 | AbsentMotion</title><meta name="description" content="沿指定方向对采样取平均值，产生运动模糊。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>方向模糊</h1><p class="meta"><a href="index.html#cat-blur">模糊</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/directionalblur.webp" width="192" height="192" alt="方向模糊 特效预览"><p>沿指定方向对采样取平均值，产生运动模糊。</p><p>方向模糊会使图层沿一个方向拖出拖影。<strong>长度</strong>是拖影的距离，<strong>角度</strong>是拖影的方向。这是固定的模糊：若要让模糊跟随图层的实际运动，请使用<a href="../effects/motionblur.html">运动模糊</a>。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>长度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 2000</td><td data-label="默认值">20</td></tr><tr><td data-label="设置项"><strong>角度</strong></td><td data-label="类型">角度</td><td data-label="范围">0&deg; 至 360&deg;</td><td data-label="默认值">0&deg;</td></tr></tbody></table></div><nav class="pager" aria-label="更多模糊特效"><a rel="prev" href="innerblur.html">&larr; 内部模糊</a><a rel="next" href="motionblur.html">运动模糊 &rarr;</a></nav></main></div></body></html>
