<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关键帧回声 | AbsentMotion</title><meta name="description" content="沿图层动画轨迹绘制其先前状态的副本。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>关键帧回声</h1><p class="meta"><a href="index.html#cat-move">移动</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/echo.webp" width="192" height="192" alt="关键帧回声 特效预览"><p>沿图层动画轨迹绘制其先前状态的副本。</p><p>回声关键帧会绘制图层在片刻之前的副本，因此运动中的图层会留下拖影。<strong>秒</strong>决定副本向前回溯的时间，<strong>数量</strong>是副本的个数，<strong>透明度</strong>决定副本的可见程度，<strong>合成</strong>则决定副本位于图层的<strong>后方</strong>还是<strong>上方</strong>。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>秒</strong></td><td data-label="类型">数字</td><td data-label="范围">-60 至 60</td><td data-label="默认值">0.5</td></tr><tr><td data-label="设置项"><strong>数量</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 20</td><td data-label="默认值">1</td></tr><tr><td data-label="设置项"><strong>透明度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">1</td></tr><tr><td data-label="设置项"><strong>合成</strong></td><td data-label="类型">选项</td><td data-label="范围">后方，上方</td><td data-label="默认值">后方</td></tr></tbody></table></div><nav class="pager" aria-label="更多移动特效"><a rel="prev" href="parentinghelper.html">&larr; 父子关联助手</a><a rel="next" href="framerate.html">帧率 &rarr;</a></nav></main></div></body></html>
