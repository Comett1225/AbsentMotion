<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摆动 | AbsentMotion</title><meta name="description" content="使图层沿指定角度、纵深或轨道往复移动。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>摆动</h1><p class="meta"><a href="index.html#cat-move">移动</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/oscillate.webp" width="192" height="192" alt="摆动 特效预览"><p>使图层沿指定角度、纵深或轨道往复移动。</p><p>往复运动会让图层自行前后移动。<strong>方向</strong>可选择沿<strong>角度</strong>移动、在<strong>深度</strong>方向移动，或绕<strong>轨道</strong>轨道移动。<strong>频率</strong>是每秒往复的次数，<strong>幅度</strong>是移动的距离，<strong>波形</strong>为正弦（平滑）或三角形（速度稳定）。使用<strong>相位</strong>可让多个图层错开，使它们不会同步移动。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>方向</strong></td><td data-label="类型">选项</td><td data-label="范围">角度，深度，轨道</td><td data-label="默认值">角度</td></tr><tr><td data-label="设置项"><strong>角度</strong></td><td data-label="类型">角度</td><td data-label="范围">-3600&deg; 至 3600&deg;</td><td data-label="默认值">45&deg;</td></tr><tr><td data-label="设置项"><strong>频率</strong></td><td data-label="类型">数字</td><td data-label="范围">0 Hz 至 16 Hz</td><td data-label="默认值">2 Hz</td></tr><tr><td data-label="设置项"><strong>幅度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 4000</td><td data-label="默认值">25</td></tr><tr><td data-label="设置项"><strong>波形</strong></td><td data-label="类型">选项</td><td data-label="范围">正弦波，三角波</td><td data-label="默认值">正弦波</td></tr><tr><td data-label="设置项"><strong>相位</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1000</td><td data-label="默认值">0</td></tr></tbody></table></div><nav class="pager" aria-label="更多移动特效"><a rel="prev" href="randomjitter.html">&larr; 随机抖动</a><a rel="next" href="swing.html">摆动 &rarr;</a></nav></main></div></body></html>
