认值">最大</td></tr><tr><td data-label="设置项"><strong>A</strong></td><td data-label="类型">选项</td><td data-label="范围">最小，最大，平均，关闭</td><td data-label="默认值">最大</td></tr></tbody></table></div><nav class="pager" aria-label="更多模糊特效"><a rel="prev" href="chromaticzoomblur.html">&larr; 色散缩放模糊</a><a rel="next" href="spinstreaks.html">旋转拖影 &rarr;</a></nav></main></div></body></html>
