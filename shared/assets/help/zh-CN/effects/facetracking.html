<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人脸跟踪 | AbsentMotion</title><meta name="description" content="视频图层的人脸运动：视频会移动并缩放，让你选择的人脸始终停在画面中的同一位置。点按“选择人脸”，再点按预览中的一张人脸。人脸会在整个片段中只跟踪一次并保存结果，预览和导出都能立即使用。“缩放”设置人脸保持的大小（100%为选择时的大小），“位置”设置它在画面中停留的位置，“平滑”让运动更平稳。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>人脸跟踪</h1><p class="meta"><a href="index.html#cat-move">移动</a> &middot; 添加于版本 5.3.2</p><img class="fx-thumb" src="../../../effects/thumb/facetrack.webp" width="192" height="192" alt="人脸跟踪 特效预览"><p>视频图层的人脸运动：视频会移动并缩放，让你选择的人脸始终停在画面中的同一位置。点按“选择人脸”，再点按预览中的一张人脸。人脸会在整个片段中只跟踪一次并保存结果，预览和导出都能立即使用。“缩放”设置人脸保持的大小（100%为选择时的大小），“位置”设置它在画面中停留的位置，“平滑”让运动更平稳。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>缩放</strong></td><td data-label="类型">数字</td><td data-label="范围">10% 至 1000%</td><td data-label="默认值">100%</td></tr><tr><td data-label="设置项"><strong>位置</strong></td><td data-label="类型">点（X, Y）</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.5, 0.5</td></tr><tr><td data-label="设置项"><strong>平滑</strong></td><td data-label="类型">数字</td><td data-label="范围">0% 至 100%</td><td data-label="默认值">30%</td></tr></tbody></table></div><nav class="pager" aria-label="更多移动特效"><a rel="prev" href="parentinghelper.html">&larr; 父子关联助手</a><a rel="next" href="echokeyframes.html">关键帧回声 &rarr;</a></nav></main></div></body></html>
