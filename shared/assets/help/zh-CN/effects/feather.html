<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>羽化 | AbsentMotion</title><meta name="description" content="柔化图层透明边缘。“向内”在现有轮廓内渐隐；“模糊透明度”还会将柔化边缘扩散到轮廓外。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>羽化</h1><p class="meta"><a href="index.html#cat-key">抠像</a> &middot; 添加于版本 3.0.0</p><img class="fx-thumb" src="../../../effects/thumb/feather.webp" width="192" height="192" alt="羽化 特效预览"><p>柔化图层透明边缘。“向内”在现有轮廓内渐隐；“模糊透明度”还会将柔化边缘扩散到轮廓外。</p><p>羽化会柔化图层的边缘。<strong>强度</strong>决定柔和边缘的宽度。<strong>边缘</strong>可选<strong>向内</strong>（边缘渐渐融入图层内部）或<strong>模糊透明度</strong>（柔和边缘同时向原始轮廓之外扩散）。在<a href="../effects/chromakey.html">色度抠像</a>之后使用，可获得更干净的抠出效果。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 300</td><td data-label="默认值">20</td></tr><tr><td data-label="设置项"><strong>边缘</strong></td><td data-label="类型">选项</td><td data-label="范围">向内，模糊透明度</td><td data-label="默认值">模糊透明度</td></tr></tbody></table></div><nav class="pager" aria-label="更多抠像特效"><a rel="prev" href="wipe.html">&larr; 擦除</a><a rel="next" href="radialwipe.html">径向擦除 &rarr;</a></nav></main></div></body></html>
