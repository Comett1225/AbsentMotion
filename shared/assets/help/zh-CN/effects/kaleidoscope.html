<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万花筒 | AbsentMotion</title><meta name="description" content="围绕中心点镜像排列切片。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>万花筒</h1><p class="meta"><a href="index.html#cat-repeat">重复</a> &middot; 添加于 2.1.0 或更早版本</p><img class="fx-thumb" src="../../../effects/thumb/kaleidoscope.webp" width="192" height="192" alt="万花筒 特效预览"><p>围绕中心点镜像排列切片。</p><p>万花筒会将画面的一个切片在一个点的周围以圆形重复排列。分段是切片的数量，<strong>角度</strong>旋转图案，<strong>中心</strong>是圆心。为角度添加动画即可产生旋转的图案。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>中心</strong></td><td data-label="类型">点（X, Y）</td><td data-label="范围">-1 至 2</td><td data-label="默认值">0.5, 0.5</td></tr><tr><td data-label="设置项"><strong>分段数</strong></td><td data-label="类型">数字</td><td data-label="范围">1 至 64</td><td data-label="默认值">6</td></tr><tr><td data-label="设置项"><strong>角度</strong></td><td data-label="类型">角度</td><td data-label="范围">-360&deg; 至 360&deg;</td><td data-label="默认值">0&deg;</td></tr><tr><td data-label="设置项"><strong>镜像</strong></td><td data-label="类型">开或关</td><td data-label="范围">&ndash;</td><td data-label="默认值">开</td></tr></tbody></table></div><nav class="pager" aria-label="更多重复特效"><span></span><a rel="next" href="mirror.html">镜像 &rarr;</a></nav></main></div></body></html>
