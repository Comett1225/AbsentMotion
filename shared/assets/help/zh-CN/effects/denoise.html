<!doctype html>
<html lang="zh-CN" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>降噪 | AbsentMotion</title><meta name="description" content="使用保留边缘的双边滤波器去除图片噪声，仅对颜色相近的邻近像素取平均值。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="帮助"><a href="../index.html">目录</a><a href="../effects/index.html">特效</a></nav></header><div class="wrap"><main id="main"><h1>降噪</h1><p class="meta"><a href="index.html#cat-blur">模糊</a> &middot; 添加于版本 2.5.0</p><img class="fx-thumb" src="../../../effects/thumb/denoise.webp" width="192" height="192" alt="降噪 特效预览"><p>使用保留边缘的双边滤波器去除图片噪声，仅对颜色相近的邻近像素取平均值。</p><p>降噪会去除颗粒和噪点，同时尽量保持边缘清晰。<strong>强度</strong>决定去除多少噪点，<strong>半径</strong>决定每个像素周围的采样范围，<strong>细节</strong>决定保留多少精细细节。降噪过度会使皮肤和表面显得平淡。</p><h2>设置</h2><div class="table-wrap"><table class="params"><thead><tr><th>设置项</th><th>类型</th><th>范围</th><th>默认值</th></tr></thead><tbody><tr><td data-label="设置项"><strong>强度</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.5</td></tr><tr><td data-label="设置项"><strong>半径</strong></td><td data-label="类型">数字</td><td data-label="范围">1 至 6</td><td data-label="默认值">2</td></tr><tr><td data-label="设置项"><strong>细节</strong></td><td data-label="类型">数字</td><td data-label="范围">0 至 1</td><td data-label="默认值">0.5</td></tr></tbody></table></div><nav class="pager" aria-label="更多模糊特效"><a rel="prev" href="fillbehind.html">&larr; 背景填充</a><span></span></nav></main></div></body></html>
