<!doctype html>
<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>노이즈 제거 | AbsentMotion</title><meta name="description" content="색상이 비슷한 주변 픽셀만 평균하는 양방향 필터로 가장자리를 유지하면서 이미지 노이즈를 제거합니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>노이즈 제거</h1><p class="meta"><a href="index.html#cat-blur">블러</a> &middot; 버전 2.5.0에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/denoise.webp" width="192" height="192" alt="노이즈 제거 이펙트 미리보기"><p>색상이 비슷한 주변 픽셀만 평균하는 양방향 필터로 가장자리를 유지하면서 이미지 노이즈를 제거합니다.</p><p>노이즈 제거는 가장자리를 선명하게 유지하면서 입자와 노이즈를 없앱니다. <strong>강도</strong>는 노이즈를 얼마나 제거할지, <strong>반경</strong>은 각 픽셀 주변을 얼마나 넓게 볼지, <strong>디테일</strong>은 미세한 디테일을 얼마나 남길지 정합니다. 너무 세게 하면 피부와 표면이 밋밋해 보입니다.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>강도</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~1</td><td data-label="기본값">0.5</td></tr><tr><td data-label="설정"><strong>반경</strong></td><td data-label="유형">숫자</td><td data-label="범위">1~6</td><td data-label="기본값">2</td></tr><tr><td data-label="설정"><strong>디테일</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~1</td><td data-label="기본값">0.5</td></tr></tbody></table></div><nav class="pager" aria-label="블러 이펙트 더 보기"><a rel="prev" href="fillbehind.html">&larr; 뒤쪽 채우기</a><span></span></nav></main></div></body></html>
