<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루마 키 | AbsentMotion</title><meta name="description" content="레이어의 어두운 부분이나 밝은 부분을 제거합니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>루마 키</h1><p class="meta"><a href="index.html#cat-key">키</a> &middot; 버전 2.1.0 이하에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/lumakey.webp" width="192" height="192" alt="루마 키 이펙트 미리보기"><p>레이어의 어두운 부분이나 밝은 부분을 제거합니다.</p><p>루마 키는 레이어의 어두운 부분을 투명하게 만듭니다(<strong>반전</strong>을 켜면 밝은 부분). <strong>임계값</strong>은 자르기가 시작되는 밝기이고, <strong>부드러움</strong>은 자르기가 얼마나 점진적인지입니다. 검은 바탕에서 촬영한 불, 연기나 불꽃 영상, 또는 <strong>반전</strong>을 쓴 흰색 배경에 유용합니다.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>기준값</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~1</td><td data-label="기본값">0.3</td></tr><tr><td data-label="설정"><strong>부드러움</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~1</td><td data-label="기본값">0.1</td></tr><tr><td data-label="설정"><strong>반전</strong></td><td data-label="유형">켜짐 또는 꺼짐</td><td data-label="범위">&ndash;</td><td data-label="기본값">꺼짐</td></tr></tbody></table></div><nav class="pager" aria-label="키 이펙트 더 보기"><a rel="prev" href="keyspillcleaner.html">&larr; 키 스필 제거</a><a rel="next" href="lumastamper.html">루마 스탬프 &rarr;</a></nav></main></div></body></html>
