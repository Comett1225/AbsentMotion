<!doctype html>
<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키프레임 에코 | AbsentMotion</title><meta name="description" content="애니메이션을 따라 조금 전 레이어의 모습을 복제해 그립니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>키프레임 에코</h1><p class="meta"><a href="index.html#cat-move">이동</a> &middot; 버전 3.0.0에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/echo.webp" width="192" height="192" alt="키프레임 에코 이펙트 미리보기"><p>애니메이션을 따라 조금 전 레이어의 모습을 복제해 그립니다.</p><p>에코는 레이어가 조금 전에 있던 모습의 복사본을 그립니다. 그래서 움직이는 레이어가 잔상을 남깁니다. <strong>초</strong>는 복사본이 몇 초 전의 모습인지, <strong>개수</strong>는 복사본이 몇 개인지, <strong>알파</strong>는 얼마나 잘 보이는지 정합니다. <strong>합성</strong>은 복사본이 레이어 <strong>뒤</strong>에 있을지 <strong>위</strong>에 있을지 정합니다.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>초</strong></td><td data-label="유형">숫자</td><td data-label="범위">-60~60</td><td data-label="기본값">0.5</td></tr><tr><td data-label="설정"><strong>개수</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~20</td><td data-label="기본값">1</td></tr><tr><td data-label="설정"><strong>알파</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~1</td><td data-label="기본값">1</td></tr><tr><td data-label="설정"><strong>합성</strong></td><td data-label="유형">선택지</td><td data-label="범위">뒤, 위</td><td data-label="기본값">뒤</td></tr></tbody></table></div><nav class="pager" aria-label="이동 이펙트 더 보기"><a rel="prev" href="parentinghelper.html">&larr; 부모 연결 도우미</a><a rel="next" href="framerate.html">프레임 레이트 &rarr;</a></nav></main></div></body></html>
