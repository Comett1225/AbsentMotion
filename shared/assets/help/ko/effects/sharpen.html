<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선명하게 | AbsentMotion</title><meta name="description" content="3x3 주변 픽셀로 언샤프 마스크를 적용해 세부 묘사를 또렷하게 합니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>선명하게</h1><p class="meta"><a href="index.html#cat-stylize">스타일화</a> &middot; 버전 2.1.0 이하에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/sharpen.webp" width="192" height="192" alt="선명하게 이펙트 미리보기"><p>3x3 주변 픽셀로 언샤프 마스크를 적용해 세부 묘사를 또렷하게 합니다.</p><p>선명하게는 미세한 디테일을 살립니다. <strong>강도</strong>는 얼마나 강하게 할지, <strong>반경</strong>은 선명해진 가장자리가 얼마나 넓은지 정합니다. 너무 세게 하면 가장자리 주변에 후광이 생깁니다. 다른 선명화 방식을 쓰려면 <a href="../effects/unsharpmask.html">언샤프 마스크</a>를 써 보세요.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>강도</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~20</td><td data-label="기본값">1</td></tr><tr><td data-label="설정"><strong>반경</strong></td><td data-label="유형">숫자</td><td data-label="범위">0.5~10</td><td data-label="기본값">1</td></tr></tbody></table></div><nav class="pager" aria-label="스타일화 이펙트 더 보기"><a rel="prev" href="particles.html">&larr; 파티클</a><a rel="next" href="vignette.html">비네트 &rarr;</a></nav></main></div></body></html>
