<!doctype html>
<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>만화경 | AbsentMotion</title><meta name="description" content="한 점을 중심으로 조각들을 거울처럼 반사합니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>만화경</h1><p class="meta"><a href="index.html#cat-repeat">반복</a> &middot; 버전 2.1.0 이하에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/kaleidoscope.webp" width="192" height="192" alt="만화경 이펙트 미리보기"><p>한 점을 중심으로 조각들을 거울처럼 반사합니다.</p><p>만화경은 그림의 한 조각을 점 주변의 원형으로 반복합니다. <strong>분할 수</strong>는 조각의 개수, <strong>각도</strong>는 패턴을 돌리는 정도, <strong>중심</strong>는 중심입니다. 각도를 애니메이션하면 돌아가는 패턴이 됩니다.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>중심</strong></td><td data-label="유형">점 (X, Y)</td><td data-label="범위">-1~2</td><td data-label="기본값">0.5, 0.5</td></tr><tr><td data-label="설정"><strong>분할 수</strong></td><td data-label="유형">숫자</td><td data-label="범위">1~64</td><td data-label="기본값">6</td></tr><tr><td data-label="설정"><strong>각도</strong></td><td data-label="유형">각도</td><td data-label="범위">-360&deg;~360&deg;</td><td data-label="기본값">0&deg;</td></tr><tr><td data-label="설정"><strong>거울</strong></td><td data-label="유형">켜짐 또는 꺼짐</td><td data-label="범위">&ndash;</td><td data-label="기본값">켜짐</td></tr></tbody></table></div><nav class="pager" aria-label="반복 이펙트 더 보기"><span></span><a rel="next" href="mirror.html">거울 &rarr;</a></nav></main></div></body></html>
