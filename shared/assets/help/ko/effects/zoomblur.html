<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>줌 블러 | AbsentMotion</title><meta name="description" content="중심점에서 뻗는 광선을 따라 샘플을 평균하여 방사형 줌 블러를 적용합니다. 강도를 조절할 수 있습니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>줌 블러</h1><p class="meta"><a href="index.html#cat-blur">블러</a> &middot; 버전 2.1.0 이하에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/radialblur.webp" width="192" height="192" alt="줌 블러 이펙트 미리보기"><p>중심점에서 뻗는 광선을 따라 샘플을 평균하여 방사형 줌 블러를 적용합니다. 강도를 조절할 수 있습니다.</p><p>줌 블러는 카메라를 줌하는 것처럼 한 점에서 바깥쪽으로 그림을 번지게 합니다. <strong>중심</strong>는 그 점이고 <strong>강도</strong>는 줄무늬의 길이입니다. 빠른 줌 전환을 위해 강도를 애니메이션하세요.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>중심</strong></td><td data-label="유형">점 (X, Y)</td><td data-label="범위">&ndash;</td><td data-label="기본값">0.5, 0.5</td></tr><tr><td data-label="설정"><strong>강도</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~1.9</td><td data-label="기본값">0.15</td></tr></tbody></table></div><nav class="pager" aria-label="블러 이펙트 더 보기"><a rel="prev" href="smear.html">&larr; 번짐</a><a rel="next" href="chromaticzoomblur.html">색수차 줌 블러 &rarr;</a></nav></main></div></body></html>
