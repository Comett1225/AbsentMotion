<!doctype html>
<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스윙 | AbsentMotion</title><meta name="description" content="레이어를 두 각도 사이에서 앞뒤로 회전시킵니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>스윙</h1><p class="meta"><a href="index.html#cat-move">이동</a> &middot; 버전 3.0.0에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/swing.webp" width="192" height="192" alt="스윙 이펙트 미리보기"><p>레이어를 두 각도 사이에서 앞뒤로 회전시킵니다.</p><p>스윙은 레이어를 <strong>각도 1</strong>과 <strong>각도 2</strong> 사이에서 앞뒤로 흔들며, 초당 <strong>주파수</strong>만큼 반복합니다. <strong>파형</strong>으로 사인(부드러움) 또는 삼각형(일정한 속도)을 고르고, <strong>위상</strong>으로 레이어마다 시작 시점을 다르게 하세요.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>주파수</strong></td><td data-label="유형">숫자</td><td data-label="범위">0.1 Hz~16 Hz</td><td data-label="기본값">2 Hz</td></tr><tr><td data-label="설정"><strong>각도 1</strong></td><td data-label="유형">각도</td><td data-label="범위">-3600&deg;~3600&deg;</td><td data-label="기본값">-30&deg;</td></tr><tr><td data-label="설정"><strong>각도 2</strong></td><td data-label="유형">각도</td><td data-label="범위">-3600&deg;~3600&deg;</td><td data-label="기본값">30&deg;</td></tr><tr><td data-label="설정"><strong>위상</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~2</td><td data-label="기본값">0</td></tr><tr><td data-label="설정"><strong>파형</strong></td><td data-label="유형">선택지</td><td data-label="범위">사인, 삼각</td><td data-label="기본값">사인</td></tr></tbody></table></div><nav class="pager" aria-label="이동 이펙트 더 보기"><a rel="prev" href="oscillate.html">&larr; 진동</a><a rel="next" href="spin.html">회전 &rar
