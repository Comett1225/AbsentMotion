<!doctype html>
<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밝기 및 대비 | AbsentMotion</title><meta name="description" content="이미지의 밝기와 대비를 조절합니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>밝기 및 대비</h1><p class="meta"><a href="index.html#cat-color">색상</a> &middot; 버전 2.1.0 이하에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/brightnesscontrast.webp" width="192" height="192" alt="밝기 및 대비 이펙트 미리보기"><p>이미지의 밝기와 대비를 조절합니다.</p><p><strong>밝기</strong>는 그림 전체를 밝게 하거나 어둡게 합니다. <strong>대비</strong>는 밝은 영역과 어두운 영역을 서로 벌리고(음수 값이면 서로 가깝게 합니다). 작은 변화부터 쓰세요. 둘 다 -1에서 1까지입니다. 그림자와 하이라이트를 더 세밀하게 조절하려면 <a href="../effects/levels.html">레벨</a>이나 <a href="../effects/highlightsshadows.html">하이라이트 및 그림자</a>를 쓰세요.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>밝기</strong></td><td data-label="유형">숫자</td><td data-label="범위">-1~1</td><td data-label="기본값">0.1</td></tr><tr><td data-label="설정"><strong>대비</strong></td><td data-label="유형">숫자</td><td data-label="범위">-1~5</td><td data-label="기본값">0.3</td></tr><tr><td data-label="설정"><strong>스타일</strong></td><td data-label="유형">선택지</td><td data-label="범위">채널별, 색상 유지</td><td data-label="기본값">채널별</td></tr></tbody></table></div><nav class="pager" aria-label="색상 이펙트 더 보기"><a rel="prev" href="hsl.html">&larr; HSL</a><a rel="next" href="solidcolor.html">단색 &rarr;</a></nav></main></div></body></html>
