<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글리치 | AbsentMotion</title><meta name="description" content="가로 블록과 색상 채널을 무작위로 이동하며 초당 몇 차례 변화합니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>글리치</h1><p class="meta"><a href="index.html#cat-distort">왜곡</a> &middot; 버전 2.1.0 이하에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/glitch.webp" width="192" height="192" alt="글리치 이펙트 미리보기"><p>가로 블록과 색상 채널을 무작위로 이동하며 초당 몇 차례 변화합니다.</p><p>글리치는 그림의 가로 띠를 옆으로 밀고, 초당 몇 번씩 색 채널을 나눕니다. <strong>강도</strong>는 얼마나 강한지, <strong>블록 높이</strong>는 띠가 얼마나 높은지, <strong>시드</strong>는 다른 무작위 패턴을 고릅니다. 컷에서 짧은 디지털 글리치를 원하면 강도를 0에서 올리며 애니메이션하세요.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>강도</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~1</td><td data-label="기본값">0.5</td></tr><tr><td data-label="설정"><strong>블록 높이</strong></td><td data-label="유형">숫자</td><td data-label="범위">4~80</td><td data-label="기본값">20</td></tr><tr><td data-label="설정"><strong>시드</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~1000</td><td data-label="기본값">0</td></tr></tbody></table></div><nav class="pager" aria-label="왜곡 이펙트 더 보기"><a rel="prev" href="innerpinchbulge.html">&larr; 내부 오목/볼록</a><a rel="next" href="noisedisplace.html">노이즈 변위 &rarr;</a></nav></main></div></body></html>
