<!doctype html>
<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디졸브 | AbsentMotion</title><meta name="description" content="레이어에서 무작위 픽셀이나 블록을 제거합니다. 강도를 애니메이션하면 디졸브 전환이 되고, 시드는 패턴을, 크기는 각 입자의 크기를 정합니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>디졸브</h1><p class="meta"><a href="index.html#cat-noise">노이즈</a> &middot; 버전 2.1.0 이하에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/dissolve.webp" width="192" height="192" alt="디졸브 이펙트 미리보기"><p>레이어에서 무작위 픽셀이나 블록을 제거합니다. 강도를 애니메이션하면 디졸브 전환이 되고, 시드는 패턴을, 크기는 각 입자의 크기를 정합니다.</p><p>디졸브는 레이어에서 무작위 얼룩을 제거합니다. 디졸브 전환을 만들려면 <strong>강도</strong>를 0에서 1까지 애니메이션하세요. <strong>크기</strong>는 각 얼룩의 크기이고, <strong>시드</strong>는 패턴을 고릅니다.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>강도</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~1</td><td data-label="기본값">0.75</td></tr><tr><td data-label="설정"><strong>시드</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~5</td><td data-label="기본값">0</td></tr><tr><td data-label="설정"><strong>크기</strong></td><td data-label="유형">숫자</td><td data-label="범위">1~200</td><td data-label="기본값">1</td></tr></tbody></table></div><nav class="pager" aria-label="노이즈 이펙트 더 보기"><a rel="prev" href="fractalridges.html">&larr; 프랙탈 산등성이</a><a rel="next" href="blockdissolve.html">블록 디졸브 &rarr;</a></nav></main></div></body></html>
