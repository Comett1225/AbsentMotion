<!doctype html>
<html lang="ko" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방향 블러 | AbsentMotion</title><meta name="description" content="지정한 각도를 따라 샘플을 평균하여 모션 블러를 만듭니다."><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="도움말"><a href="../index.html">목차</a><a href="../effects/index.html">이펙트</a></nav></header><div class="wrap"><main id="main"><h1>방향 블러</h1><p class="meta"><a href="index.html#cat-blur">블러</a> &middot; 버전 2.1.0 이하에서 추가됨</p><img class="fx-thumb" src="../../../effects/thumb/directionalblur.webp" width="192" height="192" alt="방향 블러 이펙트 미리보기"><p>지정한 각도를 따라 샘플을 평균하여 모션 블러를 만듭니다.</p><p>방향 블러는 레이어를 한 방향으로 번지게 합니다. <strong>길이</strong>는 얼마나 멀리, <strong>각도</strong>는 방향입니다. 이것은 고정된 블러입니다. 레이어가 실제로 움직이는 방식을 따르는 블러가 필요하면 <a href="../effects/motionblur.html">모션 블러</a>를 쓰세요.</p><h2>설정</h2><div class="table-wrap"><table class="params"><thead><tr><th>설정</th><th>유형</th><th>범위</th><th>기본값</th></tr></thead><tbody><tr><td data-label="설정"><strong>길이</strong></td><td data-label="유형">숫자</td><td data-label="범위">0~2000</td><td data-label="기본값">20</td></tr><tr><td data-label="설정"><strong>각도</strong></td><td data-label="유형">각도</td><td data-label="범위">0&deg;~360&deg;</td><td data-label="기본값">0&deg;</td></tr></tbody></table></div><nav class="pager" aria-label="블러 이펙트 더 보기"><a rel="prev" href="innerblur.html">&larr; 내부 블러</a><a rel="next" href="motionblur.html">모션 블러 &rarr;</a></nav></main></div></body></html>
