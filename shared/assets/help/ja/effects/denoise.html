<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ノイズ除去 | AbsentMotion</title><meta name="description" content="色が近いピクセルだけを平均するエッジ保持バイラテラルフィルタで、画像のノイズを除去します。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>ノイズ除去</h1><p class="meta"><a href="index.html#cat-blur">ブラー</a> &middot; バージョン2.5.0で追加</p><img class="fx-thumb" src="../../../effects/thumb/denoise.webp" width="192" height="192" alt="ノイズ除去エフェクトのプレビュー"><p>色が近いピクセルだけを平均するエッジ保持バイラテラルフィルタで、画像のノイズを除去します。</p><p>ノイズ除去は、輪郭をシャープに保ちながらざらつきやノイズを取り除きます。<strong>強さ</strong>はノイズをどれだけ取り除くか、<strong>半径</strong>は各ピクセルの周囲をどれだけ見るか、<strong>ディテール</strong>は細部をどれだけ残すかを表します。かけすぎると、肌や表面がのっぺりして見えます。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強さ</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1</td><td data-label="デフォルト">0.5</td></tr><tr><td data-label="設定項目"><strong>半径</strong></td><td data-label="種類">数値</td><td data-label="範囲">1〜6</td><td data-label="デフォルト">2</td></tr><tr><td data-label="設定項目"><strong>ディテール</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1</td><td data-label="デフォルト">0.5</td></tr></tbody></table></div><nav class="pager" aria-label="他のブラーエフェクト"><a rel="prev" href="fillbehind.html">&larr; 背面フィル</a><span></span></nav></main></div></body></html>
