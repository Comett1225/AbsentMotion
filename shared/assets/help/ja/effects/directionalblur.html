<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方向ブラー | AbsentMotion</title><meta name="description" content="指定した角度に沿ってサンプルを平均し、モーションブラーをかけます。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>方向ブラー</h1><p class="meta"><a href="index.html#cat-blur">ブラー</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/directionalblur.webp" width="192" height="192" alt="方向ブラーエフェクトのプレビュー"><p>指定した角度に沿ってサンプルを平均し、モーションブラーをかけます。</p><p>方向ブラーはレイヤーを一方向にぼかします。<strong>長さ</strong>はぼかしの距離、<strong>角度</strong>は方向です。固定のぼかしです。レイヤーの実際の動きに合わせてぼかしたい場合は、<a href="../effects/motionblur.html">モーションブラー</a>を使ってください。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>長さ</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜2000</td><td data-label="デフォルト">20</td></tr><tr><td data-label="設定項目"><strong>角度</strong></td><td data-label="種類">角度</td><td data-label="範囲">0&deg;〜360&deg;</td><td data-label="デフォルト">0&deg;</td></tr></tbody></table></div><nav class="pager" aria-label="他のブラーエフェクト"><a rel="prev" href="innerblur.html">&larr; 内側ブラー</a><a rel="next" href="motionblur.html">モーションブラー &rarr;</a></nav></main></div></body></html>
