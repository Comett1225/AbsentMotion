<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フェードイン/アウト | AbsentMotion</title><meta name="description" content="レイヤーの開始時にフェードインし、終了時にフェードアウトします。時間は設定できます。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>フェードイン/アウト</h1><p class="meta"><a href="index.html#cat-stylize">スタイライズ</a> &middot; バージョン3.0.0で追加</p><img class="fx-thumb" src="../../../effects/thumb/fade.webp" width="192" height="192" alt="フェードイン/アウトエフェクトのプレビュー"><p>レイヤーの開始時にフェードインし、終了時にフェードアウトします。時間は設定できます。</p><p>フェードイン/アウトは、レイヤーの開始時にフェードインし、終了時にフェードアウトします。<strong>イン</strong>と<strong>アウト</strong>はフェードの長さ（秒）です。タイトルやクリップの始まりと終わりをやわらかくする最も手軽な方法です。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>イン</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜10</td><td data-label="デフォルト">0.5</td></tr><tr><td data-label="設定項目"><strong>アウト</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜10</td><td data-label="デフォルト">0.5</td></tr></tbody></table></div><nav class="pager" aria-label="他のスタイライズエフェクト"><a rel="prev" href="blink.html">&larr; 点滅</a><a rel="next" href="unsharpmask.html">アンシャープマスク &rarr;</a></nav></main></div></body></html>
