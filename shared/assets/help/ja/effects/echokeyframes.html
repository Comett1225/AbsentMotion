<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>エコーキーフレーム | AbsentMotion</title><meta name="description" content="少し前の状態のレイヤーを、アニメーションに沿って複製して描画します。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>エコーキーフレーム</h1><p class="meta"><a href="index.html#cat-move">移動</a> &middot; バージョン3.0.0で追加</p><img class="fx-thumb" src="../../../effects/thumb/echo.webp" width="192" height="192" alt="エコーキーフレームエフェクトのプレビュー"><p>少し前の状態のレイヤーを、アニメーションに沿って複製して描画します。</p><p>Echo Keyframesは、少し前の状態のレイヤーのコピーを描画するので、動くレイヤーに残像が残ります。<strong>秒</strong>はコピーがどれだけ前の状態か、<strong>数</strong>はコピーの数、<strong>アルファ</strong>はコピーの見えやすさ、<strong>コンポジット</strong>はレイヤーの<strong>背面</strong>か<strong>前面</strong>に表示するかを設定します。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>秒</strong></td><td data-label="種類">数値</td><td data-label="範囲">-60〜60</td><td data-label="デフォルト">0.5</td></tr><tr><td data-label="設定項目"><strong>回数</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜20</td><td data-label="デフォルト">1</td></tr><tr><td data-label="設定項目"><strong>アルファ</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1</td><td data-label="デフォルト">1</td></tr><tr><td data-label="設定項目"><strong>合成</strong></td><td data-label="種類">選択</td><td data-label="範囲">背面、前面</td><td data-label="デフォルト">背面</td></tr></tbody></table></div><nav class="pager" aria-label="他の移動エフェクト"><a rel="prev" href="parentinghelper.html">&larr; ペアレントヘルパー</a><a rel="next" href="framerate.html">フレームレート &rarr;</a></nav></main></div></body></html>
