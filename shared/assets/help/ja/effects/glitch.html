<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>グリッチ | AbsentMotion</title><meta name="description" content="ランダムな横方向のブロックずれと色チャンネルのオフセットを、1秒に数回変化させます。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>グリッチ</h1><p class="meta"><a href="index.html#cat-distort">歪み</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/glitch.webp" width="192" height="192" alt="グリッチエフェクトのプレビュー"><p>ランダムな横方向のブロックずれと色チャンネルのオフセットを、1秒に数回変化させます。</p><p>グリッチは、画面の水平方向の帯を左右にずらし、色チャンネルを1秒に数回分割します。<strong>強度</strong>はエフェクトの強さ、<strong>ブロックの高さ</strong>は帯の高さ、<strong>シード</strong>は別のランダムパターンを選びます。カットの箇所で短いデジタルグリッチを出すには、<strong>強度</strong>を0からアニメーションさせます。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強度</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1</td><td data-label="デフォルト">0.5</td></tr><tr><td data-label="設定項目"><strong>ブロックの高さ</strong></td><td data-label="種類">数値</td><td data-label="範囲">4〜80</td><td data-label="デフォルト">20</td></tr><tr><td data-label="設定項目"><strong>シード</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1000</td><td data-label="デフォルト">0</td></tr></tbody></table></div><nav class="pager" aria-label="他の歪みエフェクト"><a rel="prev" href="innerpinchbulge.html">&larr; 内側ピンチ/バルジ</a><a rel="next" href="noisedisplace.html">ノイズ変位 &rarr;</a></nav></main></div></body></html>
