<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フェザー | AbsentMotion</title><meta name="description" content="レイヤーのアルファの輪郭を柔らかくします。「内側」は既存の輪郭の内側に向かってフェードし、「アルファをぼかす」は柔らかくなった輪郭を外側にも広げます。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>フェザー</h1><p class="meta"><a href="index.html#cat-key">キー</a> &middot; バージョン3.0.0で追加</p><img class="fx-thumb" src="../../../effects/thumb/feather.webp" width="192" height="192" alt="フェザーエフェクトのプレビュー"><p>レイヤーのアルファの輪郭を柔らかくします。「内側」は既存の輪郭の内側に向かってフェードし、「アルファをぼかす」は柔らかくなった輪郭を外側にも広げます。</p><p>フェザーはレイヤーの縁を柔らかくします。<strong>強さ</strong>は柔らかい縁の幅です。<strong>エッジ</strong>は<strong>内側</strong>（縁がレイヤー内へフェードする）または<strong>ぼかしアルファ</strong>（柔らかい縁が元の輪郭の外側にも広がる）です。<a href="../effects/chromakey.html">クロマキー</a>の後に使うと、切り抜きがきれいになります。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強さ</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜300</td><td data-label="デフォルト">20</td></tr><tr><td data-label="設定項目"><strong>エッジ</strong></td><td data-label="種類">選択</td><td data-label="範囲">内側、アルファをぼかす</td><td data-label="デフォルト">アルファをぼかす</td></tr></tbody></table></div><nav class="pager" aria-label="他のキーエフェクト"><a rel="prev" href="wipe.html">&larr; ワイプ</a><a rel="next" href="radialwipe.html">放射ワイプ &rarr;</a></nav></main></div></body></html>
