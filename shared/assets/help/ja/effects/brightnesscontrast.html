<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>明るさとコントラスト | AbsentMotion</title><meta name="description" content="画像の明るさとコントラストを調整します。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>明るさとコントラスト</h1><p class="meta"><a href="index.html#cat-color">カラー</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/brightnesscontrast.webp" width="192" height="192" alt="明るさとコントラストエフェクトのプレビュー"><p>画像の明るさとコントラストを調整します。</p><p><strong>明るさ</strong>は画像全体を明るくしたり暗くしたりします。<strong>コントラスト</strong>は明るい部分と暗い部分の差を広げます（負の値にすると狭まります）。まずは小さな変化から試しましょう。どちらも-1から1まで設定できます。影とハイライトをより細かく調整したい場合は、<a href="../effects/levels.html">レベル</a>や<a href="../effects/highlightsshadows.html">ハイライトと影</a>を使ってください。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>明るさ</strong></td><td data-label="種類">数値</td><td data-label="範囲">-1〜1</td><td data-label="デフォルト">0.1</td></tr><tr><td data-label="設定項目"><strong>コントラスト</strong></td><td data-label="種類">数値</td><td data-label="範囲">-1〜5</td><td data-label="デフォルト">0.3</td></tr><tr><td data-label="設定項目"><strong>スタイル</strong></td><td data-label="種類">選択</td><td data-label="範囲">チャンネルごと、色を保持</td><td data-label="デフォルト">チャンネルごと</td></tr></tbody></table></div><nav class="pager" aria-label="他のカラーエフェクト"><a rel="prev" href="hsl.html">&larr; HSL</a><a rel="next" href="solidcolor.html">単色 &rarr;</a></nav></main></div></body></html>
