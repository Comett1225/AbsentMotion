<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万華鏡 | AbsentMotion</title><meta name="description" content="点を中心に鏡映した断片を並べます。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>万華鏡</h1><p class="meta"><a href="index.html#cat-repeat">繰り返し</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/kaleidoscope.webp" width="192" height="192" alt="万華鏡エフェクトのプレビュー"><p>点を中心に鏡映した断片を並べます。</p><p>万華鏡は、ある点の周囲に画像のスライスを円状に繰り返します。<strong>Segments</strong>は分割数、<strong>角度</strong>は模様の回転、<strong>中央</strong>は中心位置です。<strong>角度</strong>をアニメーションさせると模様が回転します。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>中心</strong></td><td data-label="種類">ポイント（X, Y）</td><td data-label="範囲">-1〜2</td><td data-label="デフォルト">0.5, 0.5</td></tr><tr><td data-label="設定項目"><strong>セグメント</strong></td><td data-label="種類">数値</td><td data-label="範囲">1〜64</td><td data-label="デフォルト">6</td></tr><tr><td data-label="設定項目"><strong>角度</strong></td><td data-label="種類">角度</td><td data-label="範囲">-360&deg;〜360&deg;</td><td data-label="デフォルト">0&deg;</td></tr><tr><td data-label="設定項目"><strong>ミラー</strong></td><td data-label="種類">オン／オフ</td><td data-label="範囲">&ndash;</td><td data-label="デフォルト">オン</td></tr></tbody></table></div><nav class="pager" aria-label="他の繰り返しエフェクト"><span></span><a rel="next" href="mirror.html">ミラー &rarr;</a></nav></main></div></body></html>
