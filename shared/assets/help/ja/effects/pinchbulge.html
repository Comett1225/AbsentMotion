<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ピンチ/バルジ | AbsentMotion</title><meta name="description" content="半径（レイヤーサイズに対する割合）の円の中で、レイヤーをレンズのように膨らませる（強さが正）か、中心に向かってつまみます（強さが負）。基準を「画面」にすると、半径を画面に対する割合として扱います。減衰を「スムーズ」にすると、レンズがレイヤーの周囲によりなめらかになじみます。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>ピンチ/バルジ</h1><p class="meta"><a href="index.html#cat-distort">歪み</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/bulge.webp" width="192" height="192" alt="ピンチ/バルジエフェクトのプレビュー"><p>半径（レイヤーサイズに対する割合）の円の中で、レイヤーをレンズのように膨らませる（強さが正）か、中心に向かってつまみます（強さが負）。基準を「画面」にすると、半径を画面に対する割合として扱います。減衰を「スムーズ」にすると、レンズがレイヤーの周囲によりなめらかになじみます。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>中心</strong></td><td data-label="種類">ポイント（X, Y）</td><td data-label="範囲">0〜1</td><td data-label="デフォルト">0.5, 0.5</td></tr><tr><td data-label="設定項目"><strong>強さ</strong></td><td data-label="種類">数値</td><td data-label="範囲">-1〜1</td><td data-label="デフォルト">-0.9</td></tr><tr><td data-label="設定項目"><strong>半径</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜8</td><td data-label="デフォルト">0.3</td></tr><tr><td data-label="設定項目"><strong>基準</strong></td><td data-label="種類">選択</td><td data-label="範囲">レイヤー、画面</td><td data-label="デフォルト">レイヤー</td></tr><tr><td data-label="設定項目"><strong>減衰</strong></td><td data-label="種類">選択</td><td data-label="範囲">クラシック、スムーズ</td><td data-label="デフォルト">クラシック</td></tr></tbody></table></div><nav class="pager" aria-label="他の歪みエフェクト"><a rel="prev" href="swirl.html">&larr; スワール</a><a rel
