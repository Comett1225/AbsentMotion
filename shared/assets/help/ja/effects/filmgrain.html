<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フィルムグレイン | AbsentMotion</title><meta name="description" content="粒子の量、粒子サイズ、アニメーション速度を調整できる、動くモノクロのフィルムグレインです。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>フィルムグレイン</h1><p class="meta"><a href="index.html#cat-noise">ノイズ</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/filmgrain.webp" width="192" height="192" alt="フィルムグレインエフェクトのプレビュー"><p>粒子の量、粒子サイズ、アニメーション速度を調整できる、動くモノクロのフィルムグレインです。</p><p>Film Grainは、古いフィルムのような動く粒子を追加します。<strong>変化量</strong>は粒子の見えやすさ、<strong>粒の大きさ</strong>は粗さ、<strong>速度</strong>はちらつきの速さです。0にすると粒子は静止します。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>量</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1</td><td data-label="デフォルト">0.5</td></tr><tr><td data-label="設定項目"><strong>粒子サイズ</strong></td><td data-label="種類">数値</td><td data-label="範囲">1〜8</td><td data-label="デフォルト">4</td></tr><tr><td data-label="設定項目"><strong>速度</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜5</td><td data-label="デフォルト">1</td></tr></tbody></table></div><nav class="pager" aria-label="他のノイズエフェクト"><span></span><a rel="next" href="turbulence.html">タービュランス &rarr;</a></nav></main></div></body></html>
