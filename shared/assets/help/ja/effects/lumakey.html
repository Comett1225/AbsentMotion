<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ルマキー | AbsentMotion</title><meta name="description" content="レイヤーの暗い部分（または明るい部分）を消します。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>ルマキー</h1><p class="meta"><a href="index.html#cat-key">キー</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/lumakey.webp" width="192" height="192" alt="ルマキーエフェクトのプレビュー"><p>レイヤーの暗い部分（または明るい部分）を消します。</p><p>ルマキーは、レイヤーの暗い部分を透明にします（<strong>反転</strong>を使うと明るい部分）。<strong>しきい値</strong>は切り抜く明るさ、<strong>ぼかし</strong>は切り抜きの境目のなめらかさです。黒背景で撮影した炎や煙、火花の映像や、反転を使った白背景に便利です。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>しきい値</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1</td><td data-label="デフォルト">0.3</td></tr><tr><td data-label="設定項目"><strong>ぼかし</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1</td><td data-label="デフォルト">0.1</td></tr><tr><td data-label="設定項目"><strong>反転</strong></td><td data-label="種類">オン／オフ</td><td data-label="範囲">&ndash;</td><td data-label="デフォルト">オフ</td></tr></tbody></table></div><nav class="pager" aria-label="他のキーエフェクト"><a rel="prev" href="keyspillcleaner.html">&larr; キースピル除去</a><a rel="next" href="lumastamper.html">ルマスタンパー &rarr;</a></nav></main></div></body></html>
