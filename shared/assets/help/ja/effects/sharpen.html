<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シャープ | AbsentMotion</title><meta name="description" content="3x3の近傍を使ったアンシャープマスクで細部を強調します。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>シャープ</h1><p class="meta"><a href="index.html#cat-stylize">スタイライズ</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/sharpen.webp" width="192" height="192" alt="シャープエフェクトのプレビュー"><p>3x3の近傍を使ったアンシャープマスクで細部を強調します。</p><p>シャープは細部をくっきりさせます。<strong>強さ</strong>はその度合い、<strong>半径</strong>は輪郭をどれだけ広く強調するかを決めます。強くかけすぎると輪郭にハローが出ます。別の方法でシャープをかけたいときは<a href="../effects/unsharpmask.html">アンシャープマスク</a>を試してみてください。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強さ</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜20</td><td data-label="デフォルト">1</td></tr><tr><td data-label="設定項目"><strong>半径</strong></td><td data-label="種類">数値</td><td data-label="範囲">0.5〜10</td><td data-label="デフォルト">1</td></tr></tbody></table></div><nav class="pager" aria-label="他のスタイライズエフェクト"><a rel="prev" href="particles.html">&larr; パーティクル</a><a rel="next" href="vignette.html">ビネット &rarr;</a></nav></main></div></body></html>
