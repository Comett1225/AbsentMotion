<!doctype html>
<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色温度 | AbsentMotion</title><meta name="description" content="ケルビン単位の色温度の光のように映像を暖かく、または冷たくします。6500 Kでは変化しません。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>色温度</h1><p class="meta"><a href="index.html#cat-color">カラー</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/temperature.webp" width="192" height="192" alt="色温度エフェクトのプレビュー"><p>ケルビン単位の色温度の光のように映像を暖かく、または冷たくします。6500 Kでは変化しません。</p><p>画像を暖かくしたり冷たくしたりします。指定した色温度（ケルビン）のランプで照らしたような見た目になります。<strong>色温度</strong>が6500 Kのときは画像は変化しません。値を小さくすると暖かいオレンジ系、大きくすると冷たい青系になります。<strong>強さ</strong>で結果を元の画像とブレンドします。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>色温度</strong></td><td data-label="種類">数値</td><td data-label="範囲">1000〜40000</td><td data-label="デフォルト">3200</td></tr><tr><td data-label="設定項目"><strong>強さ</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1</td><td data-label="デフォルト">1</td></tr></tbody></table></div><nav class="pager" aria-label="他のカラーエフェクト"><a rel="prev" href="splittone.html">&larr; スプリットトーン</a><a rel="next" href="duotone.html">デュオトーン &rarr;</a></nav></main></div></body></html>
