<html lang="ja" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ディゾルブ | AbsentMotion</title><meta name="description" content="レイヤーからランダムにピクセルやブロックを消します。強さをアニメーションさせるとディゾルブ遷移になり、シードでパターン、サイズで粒の大きさを決められます。"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="../../assets/site.css"></head><body class="app" data-page="effect"><header class="top appbar"><nav class="main" aria-label="ヘルプ"><a href="../index.html">目次</a><a href="../effects/index.html">エフェクト</a></nav></header><div class="wrap"><main id="main"><h1>ディゾルブ</h1><p class="meta"><a href="index.html#cat-noise">ノイズ</a> &middot; バージョン2.1.0以前で追加</p><img class="fx-thumb" src="../../../effects/thumb/dissolve.webp" width="192" height="192" alt="ディゾルブエフェクトのプレビュー"><p>レイヤーからランダムにピクセルやブロックを消します。強さをアニメーションさせるとディゾルブ遷移になり、シードでパターン、サイズで粒の大きさを決められます。</p><p>ディゾルブはレイヤーからランダムな斑点を取り除きます。ディゾルブトランジションには、<strong>Strength</strong>を0から1にアニメーションさせます。<strong>サイズ</strong>は各斑点のサイズで、<strong>Seed</strong>がパターンを選びます。</p><h2>設定</h2><div class="table-wrap"><table class="params"><thead><tr><th>設定項目</th><th>種類</th><th>範囲</th><th>デフォルト</th></tr></thead><tbody><tr><td data-label="設定項目"><strong>強さ</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜1</td><td data-label="デフォルト">0.75</td></tr><tr><td data-label="設定項目"><strong>シード</strong></td><td data-label="種類">数値</td><td data-label="範囲">0〜5</td><td data-label="デフォルト">0</td></tr><tr><td data-label="設定項目"><strong>サイズ</strong></td><td data-label="種類">数値</td><td data-label="範囲">1〜200</td><td data-label="デフォルト">1</td></tr></tbody></table></div><nav class="pager" aria-label="他のノイズエフェクト"><a rel="prev" href="fractalridges.html">&larr; フラクタルリッジ</a><a rel="next" href="blockdissolve.html">ブロックディゾルブ &rarr;</a></nav></main></div></body></html>
